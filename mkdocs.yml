site_name: GeoCase
site_description: A curated library of geospatial test cases
site_url: https://farzinashouri.github.io/geocase
repo_url: https://github.com/farzinashouri/geocase
repo_name: fashouri/geocase

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/catalog.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Philosophy: philosophy.md
  - Benchmark:
      - Quick Start: benchmark/quickstart.md
  - User Guides:
      - Case Discovery: case-discovery.md
      - Assertions Reference: assertions-reference.md
      - Examples Index: examples-index.md
      - Testing Your Function: testing-your-function-with-geocase.md
      - Parameterized Tests: using-parameterized-tests.md
      - Adding a Case: adding-a-case.md
      - Remote Datasets: remote-datasets.md
      - Dataset Catalog: dataset-catalog.md
  - Contributing:
      - Workflow: contributing/workflow.md
      - Releasing: contributing/releasing.md
      - Viewing Schematics: contributing/viewing-schematics.md
      - Structure & Planning: contributing/structure-and-planning.md
      - Manifests & Storage: contributing/manifests-and-storage.md
      - Testing Edge Cases: contributing/testing-edge-cases.md
      - Raster Dtypes & Radiometric Resolution: contributing/raster-dtypes-and-radiometric-resolution.md
      - Vector Dataset Generation: contributing/vector-dataset-generation.md
  - Plans:
      - Overview: plans/index.md
      - Roadmap: plans/development-plan.md
      - Execution Order: plans/execution-order.md
      - Dataset Catalog Plan: plans/dataset-catalog-plan.md
      - Website Plan: plans/website-plan.md
      - Distribution (PyPI & conda): plans/11-distribution-pypi-and-conda.md
      - Docs Site Publication: plans/12-docs-site-publication.md
      - Cross-Format Canonical Convergence: plans/13-cross-format-canonical-convergence.md
      - Reposition as a Correctness Library: plans/14-reposition-as-correctness-library.md
      - GeoCase as a Benchmark: plans/15-geocase-as-benchmark.md
      - Generalize Beyond Geospatial: plans/16-generalize-beyond-geospatial.md
      - Throughput, Automation & Corpus-as-Input: plans/17-throughput-automation-and-corpus-as-input.md
      - EO Product Fixtures: plans/18-eo-product-fixtures.md
      - Spec Table as a Separate Package: plans/19-spec-table-separate-repo.md
      - Restart, Spec-First: plans/20-restart-spec-first.md
      - Adoption Action Plan: plans/21-adoption-action-plan.md
      - Portfolio Direction: plans/22-portfolio-direction.md
      - Studies/passify Gap Audit: plans/23-studies-passify-gap-audit.md
      - Catalog Site on an Owned Domain: plans/24-catalog-site-on-owned-domain.md
      - Archived Plans: plans/archive/index.md
  - Design:
      - Case Recommendation Service: design/case-recommendation-service.md
      - Case Recommendation API Spec: design/case-recommendation-api-spec.md
      - Case Recommendation User Flow: design/case-recommendation-user-flow.md
      - Database Design: design/database-design.md
  - Reference:
      - Case Catalog: _generated/catalog/index.md
      - Vector Coverage Matrix: _generated/vector-coverage-matrix.md
      - Raster Coverage Matrix: _generated/raster-coverage-matrix.md
      - Codebase Summary: reference/codebase-summary.md

# Superseded planning documents, retained as an implementation log rather than
# published. The single roadmap is plans/development-plan.md; the archive index
# that links them is in the nav, the archived plans themselves are not.
#
# The generated per-case, per-risk and per-format pages are excluded too: there
# are 186 of them and they are reached from the Case Catalog index above, not
# from the nav. They are regenerated by scripts/generate_catalog_pages.py and
# gated in CI, so listing them by hand would be both unreadable and drift-prone.
not_in_nav: |
  /plans/archive/*.md
  /_generated/catalog/cases/*.md
  /_generated/catalog/risk/*.md
  /_generated/catalog/format/*.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
