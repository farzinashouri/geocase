site_name: GeoCase
site_description: A curated library of geospatial test cases
site_url: https://farzinashouri.github.io/geocase
repo_url: https://github.com/farzinashouri/geocase
repo_name: farzinashouri/geocase

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  favicon: assets/geocase-mark-512.png

# Declaring this block at all disables the implicit default `search` plugin, so
# it must be listed explicitly or site search silently disappears.
#
# `social` (Open Graph card generation) is deliberately absent: it needs the
# native libcairo/libfreetype libraries, which are not on the docs runner, and
# an unverifiable plugin would turn the `docs` gate red. Tracked in the
# roadmap's Deferred work.
plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/farzinashouri/geocase
      name: GeoCase on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/geocase/
      name: GeoCase on PyPI

extra_css:
  - stylesheets/catalog.css

# Filtering and sorting for the generated compare page. Progressive
# enhancement: the table is rendered complete by the generator and stays
# readable with JavaScript disabled.
extra_javascript:
  - javascripts/catalog-compare.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Philosophy: philosophy.md
  - Validation Report: validation.md
  - Catalog:
      - Browse Cases: _generated/catalog/index.md
      - Compare All Cases: _generated/catalog/compare.md
      - Vector Coverage Matrix: _generated/vector-coverage-matrix.md
      - Raster Coverage Matrix: _generated/raster-coverage-matrix.md
  - Benchmark:
      - Quick Start: benchmark/quickstart.md
  - User Guides:
      - Case Discovery: case-discovery.md
      - Assertions Reference: assertions-reference.md
      - Examples Index: examples-index.md
      - Testing Your Function: testing-your-function-with-geocase.md
      - Differential Testing: differential-testing.md
      - STAC Items: stac-items.md
      - Parameterized Tests: using-parameterized-tests.md
      - Adding a Case: adding-a-case.md
      - Remote Datasets: remote-datasets.md
      - Dataset Catalog: dataset-catalog.md
  - Contributing:
      - Workflow: contributing/workflow.md
      - Releasing: contributing/releasing.md
      - PyPI Publishing Practices: contributing/pypi-publishing-practices.md
      - Viewing Schematics: contributing/viewing-schematics.md
      - Structure & Planning: contributing/structure-and-planning.md
      - Manifests & Storage: contributing/manifests-and-storage.md
      - Testing Edge Cases: contributing/testing-edge-cases.md
      - Raster Dtypes & Radiometric Resolution: contributing/raster-dtypes-and-radiometric-resolution.md
      - Vector Dataset Generation: contributing/vector-dataset-generation.md
  - Design:
      - Case Recommendation Service: design/case-recommendation-service.md
      - Case Recommendation API Spec: design/case-recommendation-api-spec.md
      - Case Recommendation User Flow: design/case-recommendation-user-flow.md
      - Database Design: design/database-design.md
  - Reference:
      - Codebase Summary: reference/codebase-summary.md
      - Repository Guide: reference/repository-guide.md

# Internal content: kept in the repository and readable on GitHub, but not
# published to the site. `exclude_docs` (unlike `not_in_nav`) removes these
# from the build entirely, so they are not reachable by URL either.
#
#   plans/            - the planning log, incl. the roadmap and superseded plans
#   geocase_validate/ - external validation reports and upstream bug drafts
#   evidence/         - the fixture-interview instrument, not documentation
exclude_docs: |
  plans/
  geocase_validate/
  evidence/

# The generated per-case, per-risk and per-format pages ARE published -- they
# are the catalog -- but reached from the Catalog hub rather than the nav.
# There are 187 of them, regenerated by scripts/generate_catalog_pages.py, so
# listing them by hand would be both unreadable and drift-prone.
not_in_nav: |
  /_generated/catalog/cases/*.md
  /_generated/catalog/risk/*.md
  /_generated/catalog/format/*.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
