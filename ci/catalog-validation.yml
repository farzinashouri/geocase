catalog_validation:
  stage: test
  # Fixture generation needs the GDAL Python bindings (``osgeo``), which are
  # source-only on PyPI, so this job runs on the upstream GDAL image where they
  # are prebuilt rather than on a bare python image.
  image: ghcr.io/osgeo/gdal:ubuntu-small-3.10.0
  before_script:
    # ``--system-site-packages`` keeps the image's osgeo bindings importable
    # while pip-installed packages land in the venv (Ubuntu marks the system
    # interpreter externally managed).
    - apt-get update -qq && apt-get install -y -qq python3-venv git
    - python3 -m venv --system-site-packages /venv
    - . /venv/bin/activate
    - python -m pip install --upgrade pip
    # The image's osgeo bindings are compiled against NumPy 1.x; letting pip
    # pull NumPy 2 breaks ``osgeo.gdal_array`` at import time.
    - python -m pip install -e .[raster] "numpy<2"
  script:
    - python scripts/build_case_index.py --check
    - python scripts/validate_catalog.py
    - python scripts/generate_raster_fixtures.py --check
    - python scripts/generate_checksums.py --check --data-root src/geocase/data/core/raster
    - python scripts/generate_vector_coverage_matrix.py --output docs/_generated/vector-coverage-matrix.md
    - git diff --exit-code -- docs/_generated/vector-coverage-matrix.md
    - python scripts/generate_raster_coverage_matrix.py --output docs/_generated/raster-coverage-matrix.md
    - git diff --exit-code -- docs/_generated/raster-coverage-matrix.md
