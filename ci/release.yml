# Tag-triggered build and publish.
#
# Every other job in this pipeline is gated to push/merge_request events, so
# nothing here runs on ordinary commits -- these three jobs fire only on an
# annotated `vX.Y.Z` (or `vX.Y.ZrcN`) tag.
#
# Uploading uses PyPI's OIDC trusted publishing: GitLab mints a short-lived
# JWT, PyPI exchanges it for an API token good for ~15 minutes. No
# `TWINE_PASSWORD` is ever stored in CI variables, so there is no long-lived
# credential to leak or rotate.

.release_rules: &release_rules
  # rc tags (v1.0.0rc1) and final tags (v1.0.0) both build; which registry
  # they upload to is chosen by running the corresponding manual job.
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc\d+)?$/'
  - when: never

# Exchange the GitLab-issued JWT for a short-lived PyPI API token, then upload.
# Shared verbatim by both publish jobs so the TestPyPI dry run exercises the
# identical code path as the real upload -- a hand-run alternative command
# would prove nothing about the job that actually matters.
.publish_script: &publish_script
  - |
    set -euo pipefail
    RESPONSE="$(curl --silent --show-error --fail-with-body \
      --request POST "$PYPI_MINT_URL" \
      --header 'Content-Type: application/json' \
      --data "{\"token\":\"${PYPI_ID_TOKEN}\"}")"
    TWINE_USERNAME=__token__
    TWINE_PASSWORD="$(printf '%s' "$RESPONSE" \
      | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
    export TWINE_USERNAME TWINE_PASSWORD
    twine upload --repository-url "$PYPI_UPLOAD_URL" dist/*

build_dist:
  stage: release
  image: python:3.11
  rules: *release_rules
  before_script:
    - python -m pip install --upgrade pip
    # Pinned, like the lint gate: an unpinned build backend would let the
    # artifact change without a code change.
    - python -m pip install "build==1.2.2" "twine==6.1.0"
    # The verifier imports `geocase.catalog.loader` to read the case index,
    # and compares the artifact version against `geocase.__version__`.
    - python -m pip install -e . --no-deps
  script:
    - python -m build
    # The gate. PyPI artifacts are immutable, so a wheel missing
    # `geocase/data/**` would be a permanently broken release. This checks all
    # 134 indexed cases are present, that the version matches the tag, and
    # that no `__pycache__`/`.pyc`/`.DS_Store` slipped in.
    - python scripts/verify_dist.py dist/ --expected-version "$CI_COMMIT_TAG"
    - twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# Both publish jobs are `when: manual`: cutting the tag and uploading should
# not be the same action, because the upload cannot be undone.

publish_testpypi:
  stage: release
  image: python:3.11
  needs: [build_dist]
  rules: *release_rules
  when: manual
  id_tokens:
    PYPI_ID_TOKEN:
      aud: testpypi
  variables:
    PYPI_MINT_URL: https://test.pypi.org/_/oidc/mint-token
    PYPI_UPLOAD_URL: https://test.pypi.org/legacy/
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install "twine==6.1.0"
  script: *publish_script

publish_pypi:
  stage: release
  image: python:3.11
  needs: [build_dist]
  rules: *release_rules
  when: manual
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  variables:
    PYPI_MINT_URL: https://pypi.org/_/oidc/mint-token
    PYPI_UPLOAD_URL: https://upload.pypi.org/legacy/
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install "twine==6.1.0"
  script: *publish_script
