docs:
  stage: test
  image: python:3.11
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  before_script:
    # mkdocs needs no project dependencies -- the generated catalog pages are
    # committed, and this job only renders markdown.
    - python -m pip install --upgrade pip
    - python -m pip install -e .[docs]
  script:
    # ``--strict`` turns broken internal links into a build failure. Without it
    # every case page linked its risk hubs one directory too high -- 187 broken
    # links, shipped, because nothing rendered the site in CI.
    - mkdocs build --strict
