type: object
required:
  - id
  - title
  - category
  - format
  - test_tier
  - size_class
  - storage_class
  - redistributable
  - tags
  - risk_types
  - files
  - loader_hint
  - expected_capabilities
  - schema_version
properties:
  id:
    type: string
    description: Stable machine-readable case identifier.
    pattern: "^[a-z0-9_]+$"

  title:
    type: string
    description: Human-readable title.

  description:
    type: string

  category:
    type: string
    enum:
      - vector
      - raster
      - netcdf
      - satellite

  format:
    type: string
    # Must stay identical to `FormatType` in geocase/catalog/models.py;
    # tests/unit/test_case_models.py asserts it.
    enum:
      - GeoJSON
      - GPKG
      - Shapefile
      - GeoTIFF
      - NetCDF
      - Parquet
      - GML
      - KML
      - CSV_WKT
      - Feather
      - Arrow
      - GeoArrow
      - WKB
      - WKT
      - SQLite
      - FlatGeobuf
      - Other

  test_tier:
    type: string
    enum:
      - unit
      - integration
      - slow
      - remote
      - private

  size_class:
    type: string
    enum:
      - tiny
      - small
      - medium
      - large

  storage_class:
    type: string
    enum:
      - bundled
      - remote
      - private

  redistributable:
    type: boolean

  schema_version:
    type: string
    description: Metadata schema version, e.g. '1.0'.

  status:
    type: string
    enum:
      - draft
      - validated
      - published
      - deprecated
      - archived

  tags:
    type: array
    items:
      type: string

  risk_types:
    type: array
    items:
      type: string

  behavioral_goal:
    type: string

  expected_capabilities:
    type: array
    items:
      type: string

  loader_hint:
    type: string
    enum:
      - geopandas
      - rasterio
      - xarray
      - generic

  geometry_type:
    type: string
    enum:
      - Point
      - MultiPoint
      - LineString
      - MultiLineString
      - Polygon
      - MultiPolygon
      - Raster
      - NetCDF
      - Mixed

  crs:
    type: string
    description: Declared CRS identifier, usually EPSG or OGC form.

  extent:
    type: object
    description: >
      WGS84 bounding box of the case's data. Generated from the real bytes by
      scripts/catalog_extent.py -- do not hand-edit. `west` greater than `east`
      is valid and means the box crosses the antimeridian.
    required:
      - west
      - south
      - east
      - north
    properties:
      west:
        type: number
        minimum: -180
        maximum: 180
      south:
        type: number
        minimum: -90
        maximum: 90
      east:
        type: number
        minimum: -180
        maximum: 180
      north:
        type: number
        minimum: -90
        maximum: 90
    additionalProperties: false

  region:
    type: string
    description: >
      Short human-readable place label, hand-written. Say so when the placement
      is synthetic, e.g. "Central Europe (synthetic)".

  files:
    type: object
    required:
      - primary
    properties:
      primary:
        type: string
      preview:
        type: string
      notes:
        type: string
      sidecars:
        type: array
        items:
          type: string

  remote:
    type: object
    properties:
      manifest_key:
        type: string
      uri:
        type: string
      checksum_sha256:
        type: string
      byte_size:
        type: integer

  source:
    type: object
    properties:
      name:
        type: string
      url:
        type: string
      license:
        type: string
      derived_from:
        type: string

  assertions:
    type: object
    # Must stay in step with `AssertionHints` in
    # geocase/catalog/models.py; tests/unit/test_case_models.py asserts it.
    properties:
      expect_loadable:
        type: boolean
      expect_valid_geometry:
        type: boolean
      expect_crs:
        type: boolean
      expected_epsg:
        type: integer
      expected_geometry_types:
        type: array
        items:
          type: string
      expect_nodata:
        type: boolean

      # Typed raster expectations
      expected_band_count:
        type: integer
      expected_dtype:
        type: string
      expected_shape:
        type: array
        items:
          type: integer
      expected_nodata_value:
        type: number
      nodata_convention:
        type: string
        enum:
          - sentinel
          - nan
          - mask
          - none
      expected_compression:
        type: string
      expected_overviews:
        type: boolean
      expected_band_names:
        type: array
        items:
          type: string
      expected_scale_factor:
        type: number
      expected_colormap_present:
        type: boolean
      is_cog:
        type: boolean
      expected_transform_signs:
        type: array
        items:
          type: string
          enum:
            - positive_e
            - negative_e
            - rotated
      expected_pixel_anchor:
        type: string
        enum:
          - area
          - point

      # OGR driver prerequisites for an *external* consumer (pyogrio, fiona,
      # ogr2ogr) — not for geocase, which reads every vector case without OGR.
      # A driver name means "install this plugin"; the empty string means no
      # OGR driver exists (a bare WKB/WKT geometry blob).
      required_drivers:
        type: array
        items:
          type: string

  params:
    type: object
    additionalProperties: true

additionalProperties: false
