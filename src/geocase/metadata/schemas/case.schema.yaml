type: object
required:
  - id
  - title
  - category
  - format
  - test_tier
  - size_class
  - storage_class
  - redistributable
  - tags
  - risk_types
  - files
  - loader_hint
  - expected_capabilities
  - schema_version
properties:
  id:
    type: string
    description: Stable machine-readable case identifier.
    pattern: "^[a-z0-9_]+$"

  title:
    type: string
    description: Human-readable title.

  description:
    type: string

  category:
    type: string
    enum:
      - vector
      - raster
      - netcdf
      - satellite

  format:
    type: string
    # Must stay identical to `FormatType` in geocase/catalog/models.py;
    # tests/unit/test_case_models.py asserts it.
    enum:
      - GeoJSON
      - GPKG
      - Shapefile
      - GeoTIFF
      - NetCDF
      - Parquet
      - GML
      - KML
      - CSV_WKT
      - Feather
      - Arrow
      - GeoArrow
      - WKB
      - WKT
      - SQLite
      - FlatGeobuf
      - Other

  test_tier:
    type: string
    enum:
      - unit
      - integration
      - slow
      - remote
      - private

  size_class:
    type: string
    enum:
      - tiny
      - small
      - medium
      - large

  storage_class:
    type: string
    enum:
      - bundled
      - remote
      - private

  redistributable:
    type: boolean

  schema_version:
    type: string
    description: Metadata schema version, e.g. '1.0'.

  status:
    type: string
    enum:
      - draft
      - validated
      - published
      - deprecated
      - archived

  tags:
    type: array
    items:
      type: string

  risk_types:
    type: array
    description: >
      Failure modes this case is curated around. The vocabulary is
      canonical and closed -- see src/geocase/catalog/risk_types.py, which
      is the source of truth this enum is generated from. Terms are
      family/specific where a family has more than one member; selection
      matches the full term or the bare family prefix.
    items:
      type: string
      enum:
        - attribute/corruption
        - attribute/encoding_error
        - attribute/field_name_truncation
        - attribute/loss
        - attribute/mojibake
        - attribute/schema_mismatch
        - attribute/timezone_normalization
        - attribute/type_coercion
        - band/alias_ambiguity
        - band/dimension_mismatch
        - band/incorrect_order
        - band/loss
        - band/stacking_order_ignored
        - crs/axis_order
        - crs/lat_lon_swap
        - crs/local_distortion
        - crs/mishandled
        - crs/mismatch
        - crs/projected_coordinate_assumption
        - crs/projection_failure
        - crs/reprojection_error
        - crs/units
        - crs/zone_selection
        - data/ambiguous_engine_dependent
        - data/coordinate_edge_case
        - data/linear_artifacts_after_repair
        - data/nan_propagation
        - data/projection_assumptions
        - data/quality
        - data/silent_bad_data
        - dtype/coercion
        - dtype/drift
        - dtype/nullable_coercion
        - dtype/overflow
        - dtype/range_assumption
        - dtype/range_truncation
        - dtype/value_range_violation
        - extent/antimeridian
        - extent/bbox_misinterpretation
        - extent/bounds_normalization
        - extent/coordinate_range_error
        - extent/coordinate_sign_assumption
        - extent/coordinate_wrapping
        - extent/equatorial
        - extent/polar
        - footprint/generation_error
        - footprint/geocoding_failure
        - format/arrow_ipc_behavior
        - format/binary_geometry_parsing
        - format/columnar_storage_behavior
        - format/driver_behavior
        - format/limitation
        - format/not_tiled
        - format/overviews_missing
        - format/partial_read_blind_spot
        - format/sidecar_dropped
        - format/spatial_index_failure
        - format/spec_nonconformance
        - format/sqlite_driver_behavior
        - format/text_geometry_parsing
        - format/xml_driver_behavior
        - geometry/degenerate_but_parseable
        - geometry/empty
        - geometry/false_positive_intersection
        - geometry/mixed_output
        - geometry/null_empty_conflation
        - geometry/overaggressive_dissolve
        - geometry/parse_exception
        - geometry/repair_variability
        - geometry/ring_closure
        - geometry/ring_orientation
        - geometry/silent_invalid
        - geometry/simplification_loss
        - geometry/topology_error
        - geometry/transitive_cluster_split
        - geometry/zero_length
        - measurement/area_distortion
        - measurement/distance_error
        - measurement/incorrect_area
        - measurement/incorrect_statistics
        - measurement/invalid
        - nodata/ambiguous_zero
        - nodata/default_value_sink
        - nodata/ignored
        - nodata/mask_misread
        - nodata/nan_mishandled
        - precision/coordinate_drift
        - precision/loss
        - precision/roundtrip_degradation
        - scaling/category_misread
        - scaling/colormap_dropped
        - scaling/ignored
        - scaling/incorrect_rendering
        - scaling/pixel_lattice_misclassification
        - transform/alignment_too_strict
        - transform/bottom_up
        - transform/nonsquare_pixels
        - transform/pixel_anchor
        - transform/pixel_shift
        - transform/rasterization_alignment
        - transform/resampling_assumptions
        - transform/resolution_mismatch
        - transform/rotated
        - transform/shifted_origin

  behavioral_goal:
    type: string

  expected_capabilities:
    type: array
    items:
      type: string

  loader_hint:
    type: string
    enum:
      - geopandas
      - rasterio
      - xarray
      - generic

  geometry_type:
    type: string
    enum:
      - Point
      - MultiPoint
      - LineString
      - MultiLineString
      - Polygon
      - MultiPolygon
      - Raster
      - NetCDF
      - Mixed

  crs:
    type: string
    description: Declared CRS identifier, usually EPSG or OGC form.

  extent:
    type: object
    description: >
      WGS84 bounding box of the case's data. Generated from the real bytes by
      scripts/catalog_extent.py -- do not hand-edit. `west` greater than `east`
      is valid and means the box crosses the antimeridian.
    required:
      - west
      - south
      - east
      - north
    properties:
      west:
        type: number
        minimum: -180
        maximum: 180
      south:
        type: number
        minimum: -90
        maximum: 90
      east:
        type: number
        minimum: -180
        maximum: 180
      north:
        type: number
        minimum: -90
        maximum: 90
    additionalProperties: false

  region:
    type: string
    description: >
      Short human-readable place label, hand-written. Say so when the placement
      is synthetic, e.g. "Central Europe (synthetic)".

  files:
    type: object
    required:
      - primary
    properties:
      primary:
        type: string
      preview:
        type: string
      notes:
        type: string
      sidecars:
        type: array
        items:
          type: string

  remote:
    type: object
    properties:
      manifest_key:
        type: string
      uri:
        type: string
      checksum_sha256:
        type: string
      byte_size:
        type: integer

  source:
    type: object
    properties:
      name:
        type: string
      url:
        type: string
      license:
        type: string
      derived_from:
        type: string

  assertions:
    type: object
    # Must stay in step with `AssertionHints` in
    # geocase/catalog/models.py; tests/unit/test_case_models.py asserts it.
    properties:
      expect_loadable:
        type: boolean
      expect_valid_geometry:
        type: boolean
      expect_crs:
        type: boolean
      expected_epsg:
        type: integer
      expected_geometry_types:
        type: array
        items:
          type: string
      expect_nodata:
        type: boolean

      # Typed raster expectations
      expected_band_count:
        type: integer
      expected_dtype:
        type: string
      expected_shape:
        type: array
        items:
          type: integer
      expected_nodata_value:
        type: number
      nodata_convention:
        type: string
        enum:
          - sentinel
          - nan
          - mask
          - none
      expected_compression:
        type: string
      expected_overviews:
        type: boolean
      expected_band_names:
        type: array
        items:
          type: string
      expected_scale_factor:
        type: number
      expected_colormap_present:
        type: boolean
      is_cog:
        type: boolean
      expected_transform_signs:
        type: array
        items:
          type: string
          enum:
            - positive_e
            - negative_e
            - rotated
      expected_pixel_anchor:
        type: string
        enum:
          - area
          - point

      # Ground truth (plan 40 phase 2). Everything above says what *shape* the
      # data has; these say what the right *answer* is, so a consumer can be
      # graded against the case without re-deriving it. Generated from the real
      # bytes by scripts/catalog_truth.py and gated by catalog/content.py.
      expected_mean_masked:
        type: number
      expected_mean_naive:
        type: number
      nodata_pixel_count:
        type: integer
      # [west, south, east, north] in the case's own CRS, not 4326 -- the
      # top-level `extent` is the WGS84 form. On a rotated raster this is the
      # axis-aligned envelope, not the four corners.
      expected_bounds:
        type: array
        items:
          type: number
      # [row, col, x, y] quadruples in the case's own CRS (plan 41 phase 3.3).
      # The answer to "where does this pixel land", so a consumer asserts
      # against a declared pair instead of hand-rolling the inverse affine --
      # which is exactly what round 4's only irreducible finding required.
      expected_pixel_world_pairs:
        type: array
        items:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4

      # OGR driver prerequisites for an *external* consumer (pyogrio, fiona,
      # ogr2ogr) — not for geocase, which reads every vector case without OGR.
      # A driver name means "install this plugin"; the empty string means no
      # OGR driver exists (a bare WKB/WKT geometry blob).
      required_drivers:
        type: array
        items:
          type: string

      # How a curated-failure case is expected to fail. A vocabulary rather
      # than an exception class, because the class belongs to the consumer.
      # Only meaningful alongside `expect_loadable: false`; AssertionHints
      # rejects it on a loadable case.
      expected_error_kind:
        type: string
        enum:
          - unparseable_geometry
          - unsupported_format
          - missing_driver
          - invalid_crs
          - invalid_topology

  # Consumer disagreements already investigated, so a repeat differential run
  # reports them as `known` rather than as a fresh failure. A record, not an
  # assertion: nothing gates whether it still reproduces, because that depends
  # on the reader the user has installed. Must stay in step with
  # `KnownDivergence` in geocase/catalog/models.py.
  known_divergences:
    type: array
    items:
      type: object
      required:
        - consumer
        - description
      properties:
        consumer:
          type: string
          description: The library that diverges, e.g. 'pyogrio'.
        version_range:
          type: string
          description: >
            Where it was observed, as free text ('>=0.8', 'GDAL 3.13.3').
            Free text because the relevant version is often a transitive one.
        description:
          type: string
          description: What differs, in a sentence a reader can act on.
        upstream_url:
          type: string
          description: The filed issue or PR.
      additionalProperties: false

  params:
    type: object
    additionalProperties: true

additionalProperties: false
