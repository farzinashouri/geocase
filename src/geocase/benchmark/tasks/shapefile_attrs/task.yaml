schema_version: 1
name: shapefile_attrs
title: Attribute field names of a Shapefile
function: shapefile_attrs
signature: "shapefile_attrs(path) -> list[str]"
module: gen_shapefile_attrs.py
handbook_id: null
trap_category: encoding
# Empty on purpose: the sandbox has no fiona/geopandas (see
# configs/sandbox-requirements.txt), and the DBF header is a documented binary
# format the standard library can read. The trap is the 10-char limit, not the
# choice of reader.
packages: []
origin: plan17
# All five sidecars are staged: a .shp without its .dbf carries no attributes
# at all, so an incomplete staging would test the wrong thing.
