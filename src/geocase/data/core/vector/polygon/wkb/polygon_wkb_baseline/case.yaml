id: polygon_wkb_baseline
title: Polygon WKB Baseline
description: >
  Canonical baseline polygon stored as raw WKB to exercise the custom
  single-geometry binary loader path.
category: vector
format: WKB
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - baseline
  - wkb
  - cross_format_canonical
  - format_comparison

risk_types:
  - format/binary_geometry_parsing

behavioral_goal: >
  Provide a canonical polygon encoded as WKB so plain binary geometry
  loading can be compared against driver-backed vector formats.

expected_capabilities:
  - load
  - geometry-validation
  - bounds-check

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.0
  south: 50.0
  east: 11.0
  north: 51.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic)"

files:
  primary: polygon.wkb
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
  # No OGR driver opens a bare geometry blob; an OGR consumer must skip
  # this case. geocase itself reads it with shapely. See plan 28 phase 2.1.
  required_drivers:
    - ""

params:
  canonical_source_case_id: simple_valid_polygon
