id: polygon_geopackage_baseline
title: Polygon GeoPackage Baseline
description: >
  Canonical baseline polygon stored as a GeoPackage for cross-format
  comparison and format-specific loader behavior testing.
category: vector
format: GPKG
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - baseline
  - geopackage
  - cross_format_canonical

risk_types:
  - format_comparison

behavioral_goal: >
  Provide a canonical polygon encoded as a GeoPackage so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation
  - bounds-check

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

files:
  primary: data.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  canonical_source_case_id: simple_valid_polygon
