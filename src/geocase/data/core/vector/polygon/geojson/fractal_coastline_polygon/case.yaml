id: fractal_coastline_polygon
title: Fractal Coastline Polygon
description: >
  A Koch snowflake polygon (hexagonal seed, four subdivision passes) standing
  in for a fractally detailed coastline.  1537 vertices of self-similar
  crenellation, none of them collinear, so a consumer that simplifies,
  densifies, or indexes geometry has something with real structure to do.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - irregular_geometry
  - procedural

risk_types:
  - none

behavioral_goal: >
  Confirm that a vertex-dense, highly irregular polygon loads and validates
  intact -- no truncation of the coordinate list, no simplification, no
  self-intersection introduced by a lossy round-trip.

expected_capabilities:
  - load
  - bounds-check
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: -10.0
  south: 39.900962
  east: -7.0
  north: 42.499038

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Iberian Atlantic coast (synthetic)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
