id: dense_ring_polygon_4k
title: Dense Ring Polygon (4096 vertices)
description: >
  A 17-lobed closed ring sampled at 4096 vertices, generated from
  r(theta) = radius * (1 + 0.18*cos(17*theta)).  The vertex count is the
  point: it is an exact dial, chosen to exceed the buffer sizes and
  per-feature limits that low-vertex fixtures never reach.
category: vector
format: GeoJSON
test_tier: unit
size_class: small
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - high_vertex_count
  - irregular_geometry
  - procedural

risk_types: []

behavioral_goal: >
  Confirm that a 4096-vertex polygon survives loading with every coordinate
  intact and the ring still closed -- catching fixed-size coordinate buffers,
  silent decimation, and per-feature vertex caps.

expected_capabilities:
  - load
  - bounds-check
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 23.507575
  south: -32.010093
  east: 26.316
  north: -29.189907

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "South Africa, Free State (synthetic)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
