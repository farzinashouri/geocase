id: polygon_gml_baseline
title: Polygon GML Baseline
description: >
  Canonical baseline polygon stored as GML to exercise XML-based polygon loading with explicit CRS metadata.
category: vector
format: GML
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - baseline
  - gml
  - cross_format_canonical

risk_types:
  - format_comparison
  - xml_driver_behavior

behavioral_goal: >
  Provide a canonical polygon encoded as GML so polygon XML-driver loading can be compared against simpler baseline formats.

expected_capabilities:
  - load
  - geometry-validation
  - bounds-check

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

files:
  primary: geometry.gml
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  canonical_source_case_id: simple_valid_polygon
