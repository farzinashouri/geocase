id: dense_ring_polygon_4k_gpkg
title: Dense Ring Polygon (4096 vertices, GeoPackage)
description: >
  The same 4096-vertex lobed ring as dense_ring_polygon_4k, written through
  the GeoPackage driver.  Exercises the vertex count through a real writer and
  a binary WKB payload rather than hand-written JSON text.
category: vector
format: GPKG
test_tier: unit
size_class: small
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - high_vertex_count
  - irregular_geometry
  - procedural

risk_types:
  - none

behavioral_goal: >
  Confirm that a 4096-vertex polygon round-trips through a GeoPackage with
  every coordinate intact, so a driver-side vertex limit or WKB truncation is
  visible rather than silent.

expected_capabilities:
  - load
  - bounds-check
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 23.507575
  south: -32.010093
  east: 26.316
  north: -29.189907

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "South Africa, Free State (synthetic)"

files:
  primary: dense_ring.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
