id: multipolygon_wkb_baseline
title: MultiPolygon WKB Baseline
description: >
  Canonical baseline multipolygon stored as binary WKB file for
  cross-format comparison and format-specific loader behavior testing.
category: vector
format: WKB
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multipolygon
  - valid
  - baseline
  - wkb
  - cross_format_canonical
  - format_comparison

risk_types: []

behavioral_goal: >
  Provide a canonical multipolygon encoded as WKB so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: MultiPolygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: -96.0
  south: 68.0
  east: -94.5
  north: 68.5

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Nunavut, Canadian Arctic (synthetic)"

files:
  primary: geometry.wkb
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: false
  expected_geometry_types:
    - MultiPolygon
  # No OGR driver opens a bare geometry blob; an OGR consumer must skip
  # this case. geocase itself reads it with shapely. See plan 28 phase 2.1.
  required_drivers:
    - ""

params:
  canonical_source_case_id: simple_valid_multipolygon
