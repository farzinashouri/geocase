id: multipolygon_sqlite_baseline
title: MultiPolygon SQLite Baseline
description: >
  Canonical baseline multipolygon stored as SQLite/SpatiaLite for
  cross-format comparison and format-specific loader behavior testing.
category: vector
format: SQLite
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multipolygon
  - valid
  - baseline
  - sqlite
  - spatialite
  - cross_format_canonical

risk_types:
  - format_comparison

behavioral_goal: >
  Provide a canonical multipolygon encoded as SQLite so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation
  - bounds-check

loader_hint: geopandas
geometry_type: MultiPolygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.0
  south: 50.0
  east: 11.5
  north: 50.5

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic)"

files:
  primary: data.sqlite
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - MultiPolygon

params:
  canonical_source_case_id: simple_valid_multipolygon
