id: multilinestring_wkb_baseline
title: MultiLineString WKB Baseline
description: >
  Canonical baseline multilinestring stored as binary WKB file for
  cross-format comparison and format-specific loader behavior testing.
category: vector
format: WKB
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multilinestring
  - valid
  - baseline
  - wkb
  - cross_format_canonical

risk_types:
  - format_comparison

behavioral_goal: >
  Provide a canonical multilinestring encoded as WKB so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: MultiLineString
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.0
  south: 49.8
  east: 11.1
  north: 50.2

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic)"

files:
  primary: geometry.wkb
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: false
  expected_geometry_types:
    - MultiLineString

params:
  canonical_source_case_id: simple_valid_multilinestring
