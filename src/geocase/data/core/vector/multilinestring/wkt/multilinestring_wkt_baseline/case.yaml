id: multilinestring_wkt_baseline
title: MultiLineString WKT Baseline
description: >
  Canonical baseline multilinestring stored as plain WKT file for
  cross-format comparison and format-specific loader behavior testing.
category: vector
format: WKT
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multilinestring
  - valid
  - baseline
  - wkt
  - cross_format_canonical
  - format_comparison

risk_types: []

behavioral_goal: >
  Provide a canonical multilinestring encoded as WKT so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: MultiLineString
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 36.1
  south: -0.7
  east: 37.2
  north: -0.3

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Great Rift Valley, East Africa (synthetic)"

files:
  primary: geometry.wkt
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: false
  expected_geometry_types:
    - MultiLineString
  # No OGR driver opens a bare geometry blob; an OGR consumer must skip
  # this case. geocase itself reads it with shapely. See plan 28 phase 2.1.
  required_drivers:
    - ""

params:
  canonical_source_case_id: simple_valid_multilinestring
