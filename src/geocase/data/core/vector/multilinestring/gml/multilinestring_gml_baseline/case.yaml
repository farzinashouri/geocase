id: multilinestring_gml_baseline
title: MultiLineString GML Baseline
description: >
  Canonical baseline multilinestring stored as GML for
  cross-format comparison and format-specific loader behavior testing.
category: vector
format: GML
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multilinestring
  - valid
  - baseline
  - gml
  - cross_format_canonical
  - format_comparison

risk_types:
  # Added in plan 34. These files are written with
  # urn:ogc:def:crs:EPSG::4326, and the URN form forces EPSG:4326's declared
  # (latitude, longitude) axis order regardless of GDAL's traditional-order
  # setting -- so the bytes on disk really are lat-first. OGR reads them back
  # correctly; a naive text parse of the XML does not. See notes.md.
  - crs/axis_order

behavioral_goal: >
  Provide a canonical multilinestring encoded as GML so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation
  - bounds-check

loader_hint: geopandas
geometry_type: MultiLineString
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 36.1
  south: -0.7
  east: 37.2
  north: -0.3

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Great Rift Valley, East Africa (synthetic)"

files:
  primary: data.gml
  sidecars:
    # Written by OGR alongside the .gml and hashed by generate_checksums.py,
    # but undeclared until plan 13 -- and validate_catalog.py only checks
    # files a case declares, so a missing schema would have shipped unnoticed.
    - data.xsd
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - MultiLineString

params:
  canonical_source_case_id: simple_valid_multilinestring
