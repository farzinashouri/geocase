id: simple_valid_multipoint
title: Simple Valid MultiPoint
description: >
  A minimal MultiPoint fixture in EPSG:4326 to cover non-singleton
  point geometry behavior.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multipoint
  - valid
  - baseline

risk_types: []

behavioral_goal: >
  Ensure MultiPoint fixtures are discoverable and load correctly for
  selector-driven tests.

expected_capabilities:
  - load
  - geometry-validation
  - selector-filtering

loader_hint: geopandas
geometry_type: MultiPoint
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 142.4
  south: 43.1
  east: 142.8
  north: 43.3

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Hokkaido, Northern Japan (synthetic)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - MultiPoint

params:
  expected_feature_count: 1
