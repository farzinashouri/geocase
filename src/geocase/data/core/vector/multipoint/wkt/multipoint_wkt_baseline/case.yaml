id: multipoint_wkt_baseline
title: MultiPoint WKT Baseline
description: >
  Canonical baseline multipoint stored as plain WKT file for
  cross-format comparison and format-specific loader behavior testing.
category: vector
format: WKT
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multipoint
  - valid
  - baseline
  - wkt
  - cross_format_canonical

risk_types:
  - format_comparison

behavioral_goal: >
  Provide a canonical multipoint encoded as WKT so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: MultiPoint
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 142.4
  south: 43.1
  east: 142.8
  north: 43.3

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Hokkaido, Northern Japan (synthetic)"

files:
  primary: geometry.wkt
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: false
  expected_geometry_types:
    - MultiPoint
  # No OGR driver opens a bare geometry blob; an OGR consumer must skip
  # this case. geocase itself reads it with shapely. See plan 28 phase 2.1.
  required_drivers:
    - ""

params:
  canonical_source_case_id: simple_valid_multipoint
