id: multipoint_feather_baseline
title: MultiPoint Feather Baseline
description: >
  Canonical baseline MultiPoint stored as Feather for Arrow-backed multipart point coverage.
category: vector
format: Feather
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - multipoint
  - valid
  - baseline
  - feather
  - cross_format_canonical

risk_types:
  - format_comparison
  - columnar_storage_behavior

behavioral_goal: >
  Provide a canonical multipoint encoded as Feather so Arrow-backed multipart point loading can be compared against GeoJSON and driver-backed baselines.

expected_capabilities:
  - load
  - geometry-validation
  - reprojection

loader_hint: geopandas
geometry_type: MultiPoint
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 142.4
  south: 43.1
  east: 142.8
  north: 43.3

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Hokkaido, Northern Japan (synthetic)"

files:
  primary: geometry.feather
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - MultiPoint
  # Needs the optional GDAL Arrow/Parquet plugin (libgdal-arrow-parquet);
  # geocase itself reads this without OGR. See plan 28 phase 2.1.
  required_drivers:
    - Arrow

params:
  canonical_source_case_id: simple_valid_multipoint
