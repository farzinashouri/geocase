id: classic_antimeridian_polygon
title: Classic Antimeridian Polygon
description: >
  A polygon encoded with longitudes that jump from +179 to -179 degrees,
  representing the classic wrapped-antimeridian case.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - dateline
  - antimeridian

risk_types:
  - extent/bbox_misinterpretation
  - extent/coordinate_wrapping

behavioral_goal: >
  Provide a canonical antimeridian polygon that heuristic crossing checks
  are expected to detect.

expected_capabilities:
  - load
  - bounds-check
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 179.0
  south: 0.0
  east: -179.0
  north: 1.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Antimeridian, North Pacific"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  crosses_dateline: true
