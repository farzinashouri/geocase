id: dateline_crossing_polygon
title: Dateline crossing polygon
description: >-
  A polygon crossing the dateline. Its bounding box spans the whole planet unless antimeridian
  wrapping is handled, breaking bbox filters and reprojection.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - dateline
  - antimeridian
  - vector
  - polygon
  - crs

risk_types:
  - crs/reprojection_error
  - extent/bbox_misinterpretation
  - extent/coordinate_wrapping

behavioral_goal: >
  Detect code that assumes longitude continuity across the antimeridian
  or produces incorrect bounds.

expected_capabilities:
  - load
  - bounds-check
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 170.0
  south: 40.0
  east: -170.0
  north: 50.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Antimeridian, North Pacific"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  crosses_dateline: true
  intended_failure_modes:
    - naive_bounds_logic
    - incorrect_longitude_normalization
