id: wrapped_longitude_point
title: Wrapped Longitude Point
description: >-
  A point stored at longitude 190° instead of the normalized -170°. Exercises longitude
  normalization that passes validation and misplaces the point.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - longitude_wrapping
  - dateline
  - reprojection

risk_types:
  - extent/antimeridian

behavioral_goal: >
  Expose helpers that preserve wrapped geographic longitudes instead of
  normalizing them back into the usual [-180, 180] interval.

expected_capabilities:
  - load
  - geometry-validation
  - coordinate-normalization

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: -170.0
  south: 45.0
  east: -170.0
  north: 45.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "North Pacific, near the antimeridian"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  source_lon: 190.0
  source_lat: 45.0
  normalized_lon: -170.0
