id: dateline_points_pair
title: Dateline Points Pair
description: >
  Two points positioned on opposite sides of the antimeridian but very
  close in real-world distance. Useful for exposing longitude-wrapping
  clustering and UTM-zone edge logic.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - dateline
  - antimeridian
  - clustering

risk_types:
  - crs/zone_selection
  - extent/coordinate_wrapping
  - measurement/distance_error

behavioral_goal: >
  Expose logic that treats antimeridian-adjacent points as far apart.

expected_capabilities:
  - load
  - geometry-validation
  - proximity-check

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 179.9
  south: 45.0
  east: -179.9
  north: 45.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Antimeridian, North Pacific"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  expected_west_utm_epsg: 32601
  expected_east_utm_epsg: 32660
