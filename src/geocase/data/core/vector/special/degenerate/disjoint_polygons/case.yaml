id: disjoint_polygons
title: Disjoint Polygons
description: >
  Two separated polygon features in the same vector dataset. Useful for
  dissolve and intersection tests that should preserve non-overlapping parts.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - multipart
  - topology

risk_types:
  - geometry/false_positive_intersection
  - geometry/overaggressive_dissolve

behavioral_goal: >
  Confirm that disjoint features remain separate and do not intersect.

expected_capabilities:
  - load
  - geometry-validation
  - topology-check

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 20.0
  south: 0.0
  east: 24.0
  north: 1.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Near the origin (synthetic, no real-world location)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
