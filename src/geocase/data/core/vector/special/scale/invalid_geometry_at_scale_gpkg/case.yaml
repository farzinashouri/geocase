id: invalid_geometry_at_scale_gpkg
title: Invalid Geometry at Feature 9,999 (GeoPackage)
description: >
  A GeoPackage of 10,000 polygons in which exactly one -- the last -- is a
  self-intersecting bowtie. Every feature before it is a valid triangle, so a
  validity sweep that reads only the first batch, samples a head, or stops
  early reports the layer clean. The defect is placed past every plausible
  batch boundary deliberately: it is what separates a consumer that validates
  the data from one that validates the first page of it.
category: vector
format: GPKG
test_tier: unit
size_class: small
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - invalid
  - large
  - batch_boundary
  - procedural

risk_types:
  - silent_invalid_geometry
  - partial_read_blind_spot

behavioral_goal: >
  Expose consumers that validate a prefix rather than a dataset: a first-batch
  read, a head sample, or a paged sweep that stops before the final page all
  report this layer as fully valid. A consumer that reads every feature finds
  the bowtie at index 9,999.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.0
  south: 50.0
  east: 10.498
  north: 50.498

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic lattice)"

files:
  primary: invalid_at_scale.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  # The layer contains an invalid geometry by construction, so the positive
  # direction cannot be declared. See the expect_loadable x
  # expect_valid_geometry matrix in docs/adding-a-case.md.
  expect_valid_geometry: false
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  expected_feature_count: 10000
  # The generator takes the feature count from the field above; these two
  # record what the case *claims* about that population, and are what
  # tests/unit/test_large_vector_cases.py asserts against the real bytes.
  invalid_feature_index: 9999
  invalid_feature_count: 1
