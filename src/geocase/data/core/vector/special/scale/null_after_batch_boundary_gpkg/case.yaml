id: null_after_batch_boundary_gpkg
title: First NULL After 10,000 Non-NULL Values (GeoPackage)
description: >
  A GeoPackage of 10,001 points whose integer `measure` column is non-NULL for
  the first 10,000 rows and NULL for the last. A reader that infers a column
  type from a head sample types it as an integer; a reader that scans the whole
  column has to widen it to accommodate the missing value. pyogrio returns
  int64 from a partial read and float64 from the full read of this same column
  -- a dtype that depends on how much of the file was read.
category: vector
format: GPKG
test_tier: unit
size_class: small
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - large
  - batch_boundary
  - null_handling
  - procedural

risk_types:
  - dtype_drift
  - partial_read_blind_spot
  - null_empty_conflation

behavioral_goal: >
  Expose consumers whose column dtype depends on how many rows they read.
  A schema inferred from the first batch says integer; the full column is
  nullable, so the value read back at row 10,000 is either a float, a sentinel,
  or a silent zero depending on the reader.

expected_capabilities:
  - load
  - null-handling
  - attribute-check

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.0
  south: 50.0
  east: 10.495
  north: 50.5

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic lattice)"

files:
  primary: null_after_boundary.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  expected_feature_count: 10001
  # Which row carries the only NULL, and in which column. Asserted against the
  # real bytes by tests/unit/test_large_vector_cases.py.
  null_column: measure
  null_row_index: 10000
  null_value_count: 1
