id: mixed_timezone_after_batch_gpkg
title: UTC Offset Changes at Row 10,000 (GeoPackage)
description: >
  A GeoPackage of 10,001 points whose `observed` DATETIME column carries a
  +01:00 offset for the first 10,000 rows and +05:30 for the last. GeoPackage
  stores DATETIME as ISO 8601 text, so both offsets survive on disk. A reader
  that infers a timezone from a head sample returns a column fixed at +01:00; a
  reader that scans the whole column has to fall back to UTC. pyogrio returns
  datetime64[ms, UTC+01:00] from a partial read and datetime64[ms, UTC] from
  the full read of this same column.
  Note that numeric UTC offsets violate GeoPackage requirement 15, which wants
  DATETIME in UTC with a literal 'Z'. That non-conformance is the case's
  subject, not an oversight: a conformant all-'Z' file shows no dtype
  instability at all, and files in the wild carry numeric offsets anyway.
  GDAL emits a "Non-conformant content" warning when reading it.
category: vector
format: GPKG
test_tier: unit
size_class: small
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - large
  - batch_boundary
  - datetime
  - procedural

risk_types:
  - attribute/timezone_normalization
  - dtype/drift
  - format/partial_read_blind_spot
  - format/spec_nonconformance

behavioral_goal: >
  Expose consumers that normalize, drop or freeze a UTC offset inferred from
  part of a column. The two offsets are 4.5 hours apart, so a reader that
  discards the offset instead of converting places the last observation at the
  wrong instant rather than merely relabelling it.

expected_capabilities:
  - load
  - attribute-check

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.0
  south: 50.0
  east: 10.495
  north: 50.5

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic lattice)"

files:
  primary: mixed_timezone.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  expected_feature_count: 10001
  # The column, the two offsets, and which row diverges. Asserted against the
  # real bytes by tests/unit/test_large_vector_cases.py.
  datetime_column: observed
  majority_utc_offset: "+01:00"
  outlier_utc_offset: "+05:30"
  outlier_row_index: 10000
  # GeoPackage requirement 15 wants UTC with a literal 'Z'. Numeric offsets
  # violate it, GDAL warns about them, and that is the point of the case --
  # see notes.md. Declared so the non-conformance is a stated property rather
  # than something a user discovers from a warning.
  gpkg_datetime_conformant: false
