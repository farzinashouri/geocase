id: rasterize_match_wgs84_polygon
title: Rasterize Match WGS84 Polygon
description: >-
  A WGS84 polygon that must be reprojected to EPSG:32633 to align with its raster. Exercises
  the CRS mismatch that makes rasterization silently misalign.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - rasterization
  - crs
  - reprojection

risk_types:
  - rasterization_alignment
  - reprojection_error

behavioral_goal: >
  Confirm that vector geometries in WGS84 can be reprojected to the raster
  grid CRS and successfully rasterized.

expected_capabilities:
  - load
  - reprojection
  - rasterization

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 14.9
  south: 50.58
  east: 15.1
  north: 50.7

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic, UTM 33N)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
