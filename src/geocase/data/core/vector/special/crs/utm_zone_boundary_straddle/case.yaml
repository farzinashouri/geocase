id: utm_zone_boundary_straddle
title: UTM Zone Boundary Straddle
description: >
  A polygon spanning 5.5E-6.5E declared in EPSG:32632.  Zone 32N covers
  6E-12E, so the western half of this geometry lies outside its own declared
  zone -- legal, common in real data, and the case that makes cross-zone
  reprojection error testable.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - crs
  - utm
  - utm_zone_boundary

risk_types:
  - crs/zone_selection

behavioral_goal: >
  Confirm that a polygon extending past its declared UTM zone's edge is
  reprojected using the declared CRS throughout, rather than being silently
  re-zoned per vertex or clipped at the zone boundary.

expected_capabilities:
  - load
  - bounds-check
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:32632

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 5.5
  south: 49.5
  east: 6.5
  north: 50.2

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Luxembourg / Saarland border (synthetic, straddling UTM 31N/32N)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 32632
  expected_geometry_types:
    - Polygon

params:
  expected_utm_epsg: 32632
  declared_zone_west_edge_lon: 6.0
