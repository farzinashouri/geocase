id: svalbard_special_zone_polygon
title: Svalbard Special Zone Polygon
description: >
  A WGS84 polygon in Svalbard whose longitude falls in the special UTM 33X
  band handling range. Used to show the difference between naive UTM zone
  assignment and the Svalbard exception rules.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - utm
  - crs
  - special-case

risk_types:
  - zone_selection
  - polar_projection_edge_case

behavioral_goal: >
  Confirm that robust UTM-zone logic applies the Svalbard special zone rules.

expected_capabilities:
  - load
  - bounds-check
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  expected_utm_epsg: 32633
  naive_utm_epsg: 32634
