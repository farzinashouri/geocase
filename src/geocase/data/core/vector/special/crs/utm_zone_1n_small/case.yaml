id: utm_zone_1n_small
title: UTM Zone 1N Polygon
description: >
  A polygon recorded in EPSG:32601 -- UTM zone 1N, the westernmost zone,
  whose western edge is the antimeridian.  Pairs with the dateline cases:
  reprojecting this to WGS84 lands hard against 180 degrees, where a
  longitude-wrapping bug surfaces as a polygon spanning the whole world.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - crs
  - utm
  - antimeridian

risk_types:
  - zone_selection

behavioral_goal: >
  Confirm that a projected polygon in the first UTM zone reprojects to WGS84
  without wrapping past the antimeridian into a world-spanning extent.

expected_capabilities:
  - load
  - bounds-check
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:32601

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: -179.8
  south: 0.5
  east: -177.2
  north: 2.5

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Equatorial Pacific, west of the antimeridian (synthetic, UTM 1N)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 32601
  expected_geometry_types:
    - Polygon

params:
  expected_utm_epsg: 32601
