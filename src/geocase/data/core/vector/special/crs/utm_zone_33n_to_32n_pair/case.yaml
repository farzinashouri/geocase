id: utm_zone_33n_to_32n_pair
title: UTM Zone 33N / 32N Adjacent Pair
description: >
  One geometry, straddling the 12E meridian, recorded twice -- once as it
  appears in UTM zone 33N and once in the adjacent zone 32N.  Both features
  are stored in WGS84 so they are directly comparable; each carries its
  source EPSG and projected corner in properties.  A consumer can assert
  round-trip agreement between the two zones within tolerance.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - crs
  - utm
  - utm_zone_boundary

risk_types:
  - crs/zone_selection

behavioral_goal: >
  Confirm that the same ground footprint reprojected via two adjacent UTM
  zones agrees to within reprojection tolerance, rather than differing by the
  ~412 km the two zones' false eastings imply.

expected_capabilities:
  - load
  - bounds-check
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 11.6
  south: 52.0
  east: 12.4
  north: 52.4

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Brandenburg, Germany (synthetic, spanning UTM 32N/33N)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  adjacent_utm_epsg:
    - 32632
    - 32633
  agreement_tolerance_m: 1.0
