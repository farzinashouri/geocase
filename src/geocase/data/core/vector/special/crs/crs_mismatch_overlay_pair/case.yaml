id: crs_mismatch_overlay_pair
title: CRS Mismatch Overlay Pair
description: >
  Two layers holding the same ground footprint, one honest and one lying about
  its CRS.  The reference layer is WGS84 degrees and declares CRS84.  The
  sidecar carries UTM zone 33N eastings and northings while its GeoJSON crs
  member declares EPSG:4326.  Each file parses cleanly on its own; the defect
  exists only in the relationship between them.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - crs
  - utm
  - multi_layer
  - overlay

risk_types:
  - crs/mismatch
  - crs/reprojection_error

behavioral_goal: >
  Confirm that overlay, join and clip operations validate the CRS of every
  input against the others rather than trusting each file's declaration.  A
  consumer that trusts the sidecar's declared EPSG:4326 places the footprint
  roughly 3359 km from where it belongs, without raising anything.

expected_capabilities:
  - load
  - crs-validation
  - reprojection
  - bounds-check

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 11.6
  south: 59.9
  east: 11.8
  north: 60.05

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southeastern Norway (synthetic, UTM zone 33N)"

files:
  primary: reference_wgs84.geojson
  notes: notes.md
  sidecars:
    - mismatched_utm33.geojson

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  # The sidecar's real CRS, as opposed to the one it declares.
  sidecar_true_epsg: 32633
  sidecar_declared_epsg: 4326
  # Reprojecting the sidecar by its true EPSG lands it on the reference.
  agreement_tolerance_m: 1.0
  # Trusting the declaration instead lands it this far away.
  naive_overlay_error_min_km: 3000.0
