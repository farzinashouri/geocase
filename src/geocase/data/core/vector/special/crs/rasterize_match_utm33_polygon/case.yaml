id: rasterize_match_utm33_polygon
title: Rasterize Match UTM33 Polygon
description: >
  A projected polygon in EPSG:32633 that sits fully inside the bundled
  UTM raster extent. Used for rasterization tests that should succeed
  without reprojection.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - rasterization
  - crs
  - utm

risk_types:
  - rasterization_alignment

behavioral_goal: >
  Confirm that rasterization works when vector and raster coordinates already match.

expected_capabilities:
  - load
  - bounds-check
  - rasterization

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 14.865401
  south: 50.556352
  east: 15.134599
  north: 50.727219

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic, UTM 33N)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 32633
  expected_geometry_types:
    - Polygon
