id: utm_zone_56s_small
title: UTM Zone 56S Polygon (Sydney)
description: >
  A polygon over Sydney recorded in EPSG:32756 -- UTM zone 56 South.
  Southern-hemisphere UTM adds a 10 000 000 m false northing, so the
  northings here are around 6.26 million rather than the negative values a
  consumer that ignores the hemisphere would expect.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - crs
  - utm
  - southern_hemisphere

risk_types:
  - zone_selection

behavioral_goal: >
  Confirm that a southern-hemisphere UTM polygon reprojects to a *negative*
  latitude, catching a consumer that drops the false northing or assumes the
  northern zone code.

expected_capabilities:
  - load
  - bounds-check
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:32756

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 150.8
  south: -33.9
  east: 151.3
  north: -33.6

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Sydney, Australia (synthetic, UTM 56S)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 32756
  expected_geometry_types:
    - Polygon

params:
  expected_utm_epsg: 32756
