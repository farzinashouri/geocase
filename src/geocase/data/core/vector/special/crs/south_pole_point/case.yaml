id: south_pole_point
title: South Pole Point
description: >
  A WGS84 point located at the geographic south pole for validating
  polar edge cases, coordinate handling, and projection assumptions.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - south_pole
  - polar
  - crs

risk_types:
  - data/coordinate_edge_case
  - extent/polar

behavioral_goal: >
  Ensure point-based utilities handle the south pole without crashing
  or making incorrect longitude assumptions.

expected_capabilities:
  - load
  - geometry-validation
  - reprojection

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 0.0
  south: -90.0
  east: 0.0
  north: -90.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "South Pole"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  location_label: South Pole
