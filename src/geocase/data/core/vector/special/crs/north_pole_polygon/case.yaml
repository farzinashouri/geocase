id: north_pole_polygon
title: North Pole Polygon
description: >-
  A polygon encircling the north pole in EPSG:4326. Its area and centroid are wrong in any
  projection treating latitude/longitude as planar coordinates.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - geojson
  - crs
  - polar
  - north_pole
  - pole
  - polygon
  - edge_case

risk_types:
  - polar_projection_singularity
  - area_distortion

behavioral_goal: >
  Ensure polygon-based utilities handle geometries near the north pole
  without crashing or producing wildly incorrect area calculations.

expected_capabilities:
  - load
  - geometry-validation
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: -90.0
  south: 84.0
  east: 90.0
  north: 89.5

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "North Pole"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  encircles_north_pole: true
  min_latitude: 84.0
  max_latitude: 89.5
  vertex_count: 5
