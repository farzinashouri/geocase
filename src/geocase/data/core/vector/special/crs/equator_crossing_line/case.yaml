id: equator_crossing_line
title: Equator Crossing Line
description: >
  A WGS84 LineString crossing latitude 0 to expose equatorial edge
  cases and sign-change assumptions in coordinate handling.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - linestring
  - equator
  - crs
  - valid

risk_types:
  - extent/coordinate_sign_assumption
  - extent/equatorial

behavioral_goal: >
  Ensure line-based workflows can process geometries that cross the
  equator without coordinate sign mistakes.

expected_capabilities:
  - load
  - geometry-validation
  - bounds-check

loader_hint: geopandas
geometry_type: LineString
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: -30.0
  south: -1.0
  east: 30.0
  north: 1.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Equator at the prime meridian (synthetic)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - LineString

params:
  crosses_equator: true
