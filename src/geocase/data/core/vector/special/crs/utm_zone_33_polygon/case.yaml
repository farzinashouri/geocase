id: utm_zone_33_polygon
title: UTM Zone 33 Polygon
description: >
  A valid polygon in WGS84 whose centroid falls inside UTM zone 33N.
  Useful for baseline CRS and EPSG zone tests.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - valid
  - crs
  - utm

risk_types:
  - zone_selection

behavioral_goal: >
  Provide a stable WGS84 polygon whose representative point maps to EPSG:32633.

expected_capabilities:
  - load
  - bounds-check
  - reprojection

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 13.0
  south: 55.0
  east: 14.0
  north: 56.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Denmark / Baltic (synthetic, UTM 33N)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  expected_utm_epsg: 32633
