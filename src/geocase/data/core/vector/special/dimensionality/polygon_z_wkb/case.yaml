id: polygon_z_wkb
title: Polygon Z (WKB)
description: >
  A closed 5-vertex ring with a Z ramp, stored as raw WKB. Z lives in the
  geometry-type header, so a reader that parses the type as a plain 16-bit
  code sees a 2D polygon and reads the elevations as coordinates.
category: vector
format: WKB
geometry_type: Polygon
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - wkb
  - three-dimensional
  - dimensionality

risk_types:
  - dimension_mismatch

behavioral_goal: >
  Verify that the third ordinate survives a WKB round trip and is not
  silently dropped or mistaken for an attribute.

expected_capabilities:
  - load
  - geometry-inspection

loader_hint: geopandas
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.5
  south: 55.7
  east: 12.52
  north: 55.72

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Copenhagen, Denmark (synthetic)"

files:
  primary: geometry.wkb
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expected_geometry_types:
    - Polygon

params:
  expect_z: true
  expected_feature_count: 1
