id: polygon_z_gpkg
title: Polygon Z (GeoPackage)
description: >
  The same Z ring as polygon_z_wkb, written through OGR into a GeoPackage.
  GPKG records dimensionality in a per-geometry flag byte rather than in the
  type code, and a driver can write the 2D form without raising -- so this
  half of the pair is what proves the elevations survived transcoding.
  Its id is 9007199254740993, one past 2^53, carrying the int64 case too.
category: vector
format: GPKG
geometry_type: Polygon
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - geopackage
  - three-dimensional
  - dimensionality
  - integer-precision

risk_types:
  - dimension_mismatch
  - integer_precision

behavioral_goal: >
  Verify that Z survives the GPKG write/read cycle with the same values as
  the WKB sibling, and that a 64-bit id beyond double precision reads back
  exactly rather than rounded.

expected_capabilities:
  - load
  - geometry-inspection
  - attribute-inspection

loader_hint: geopandas
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.5
  south: 55.7
  east: 12.52
  north: 55.72

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Copenhagen, Denmark (synthetic)"

files:
  primary: geometry.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expected_geometry_types:
    - Polygon

params:
  expect_z: true
  expected_feature_count: 1
  # 2^53 + 1: the first integer a float64 cannot hold. A reader that routes
  # ids through a double returns ...992, so the check is exact equality.
  expected_id_value: 9007199254740993
