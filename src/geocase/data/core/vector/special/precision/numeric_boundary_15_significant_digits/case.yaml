title: "Numeric Boundary: 15 Significant Digits"
description: >
  A single-point GeoJSON whose coordinate round-trips in exactly 15 significant digits.
  The control for the 17-digit case. GDAL's writers default to 15 decimal places, so this value is inside the default and must survive unchanged; a consumer that loses it has a precision problem unrelated to the boundary the family is about.
category: vector
