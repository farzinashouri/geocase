id: numeric_boundary_trailing_zeros
title: "Numeric Boundary: Trailing Zeros"
description: >
  A single-point GeoJSON whose coordinate decimal expansion at 15 places ends in zeros.
  One of the two patterns ``intelliround`` (ogr/ogrutils.cpp:161-169) special-cases: it tests s[len-3] through s[len-9] for zeros and then drops the last 8 characters, including the untested s[len-2]. 0.000000010000001 loses its trailing 1 through exactly this path, which is the same mechanism as the 1e-14 finding at a magnitude nobody would call small.
category: vector
format: GeoJSON
test_tier: unit
