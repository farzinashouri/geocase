id: numeric_boundary_17_significant_digits
title: "Numeric Boundary: 17 Significant Digits"
description: >
  A single-point GeoJSON whose coordinate needs 17 significant digits to round-trip.
  17 digits is the number IEEE 754 doubles need in the worst case, and it is two more than the 15 the writer emits by default. The value is therefore expected to change on a text round-trip -- which is a documented limit, not a defect, and the case exists so a consumer can tell that limit apart from the 1e-14 class, which is a defect.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - geojson
  - precision
  - numeric_boundary
  - single_variable

risk_types:
  - failure_mode/reference_implementation
  - precision/formatter_boundary
  - precision/roundtrip_degradation
  - precision/significant_digits

behavioral_goal: >
  Establish whether a text write/read cycle returns this coordinate unchanged.
  The expected answer ships with the case, so a consumer is graded rather than
  left to re-derive what "survived" means.

expected_capabilities:
  - load
  - geometry-validation
  - coordinate-precision-check

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

