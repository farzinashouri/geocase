id: nearby_points_cluster
title: Nearby Points Cluster
description: >
  Three nearby WGS84 points that should cluster together under a modest
  metric distance threshold.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - clustering
  - baseline

risk_types:
  - distance_threshold_error

behavioral_goal: >
  Confirm that nearby local points are grouped into a single cluster.

expected_capabilities:
  - load
  - geometry-validation
  - proximity-check

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.0
  south: 55.0
  east: 12.0002
  north: 55.0001

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Copenhagen, Denmark (synthetic)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  expected_cluster_count: 1
