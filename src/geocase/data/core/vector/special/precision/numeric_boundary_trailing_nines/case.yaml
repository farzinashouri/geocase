id: numeric_boundary_trailing_nines
title: "Numeric Boundary: Trailing Nines"
description: >
  A single-point GeoJSON whose coordinate decimal expansion at 15 places ends in nines.
  The other pattern ``intelliround`` special-cases, and the one where rounding up carries across every digit. The y value is also the case where the carry crosses an integer boundary, so a consumer rounding to 15 places returns 51.0 for a point that was never at 51.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
