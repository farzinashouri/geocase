id: unclosed_ring_polygon
title: Unclosed Ring Polygon
description: >
  A polygon where the exterior ring isn't properly closed (first coordinate ≠ last coordinate).
  Per GeoJSON spec (RFC 7946), a LinearRing must have four or more positions with the first
  and last positions being equivalent. Strict parsers will reject this entirely.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - invalid
  - unclosed_ring
  - topology
  - parse_error

risk_types:
  - geometry/parse_exception
  - geometry/ring_closure
  - geometry/silent_invalid
  - geometry/topology_error

behavioral_goal: >
  Expose loaders or validators that silently accept unclosed polygon rings,
  which can cause downstream geometry operations to fail unpredictably.
  Note: Many parsers (Shapely, GeoPandas) auto-close rings on load, so this
  primarily tests raw JSON validation or strict-mode parsers.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Unplaceable -- the geometry is deliberately malformed"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: false
  # The ring never constructs -- shapely raises GEOSException
  # ("Points of LinearRing do not form a closed linestring") before any
  # validity question arises. So a consumer needs pytest.raises here, not
  # `assert not geom.is_valid`; see docs/adding-a-case.md for the matrix.
  expected_error_kind: unparseable_geometry
  expect_valid_geometry: false
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  is_valid: false
  ring_closed: false
