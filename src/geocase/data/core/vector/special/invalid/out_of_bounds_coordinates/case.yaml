id: out_of_bounds_coordinates
title: Out-of-Bounds / Invalid Coordinates
description: >
  A point with latitude exceeding the valid range (100° instead of max 90°).
  This typically indicates a lat/lon coordinate swap or data entry error.
  GeoJSON requires [Longitude, Latitude] order, but many systems use [Lat, Lon].
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - invalid
  - out_of_bounds
  - coordinate_error
  - lat_lon_swap

risk_types:
  - coordinate_range_error
  - lat_lon_swap
  - silent_invalid_geometry
  - projection_failure
  - spatial_index_failure

behavioral_goal: >
  Expose code that silently accepts coordinates outside valid geographic ranges.
  Latitude must be in [-90, 90], longitude in [-180, 180].
  Values exceeding these ranges indicate data errors or coordinate order swaps.

expected_capabilities:
  - load
  - geometry-validation
  - coordinate-validation

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: false
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  is_valid: false
  coordinate_error_type: out_of_bounds
  latitude_in_file: 100.0
  longitude_in_file: -0.1
