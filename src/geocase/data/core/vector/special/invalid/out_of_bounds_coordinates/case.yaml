id: out_of_bounds_coordinates
title: Out-of-Bounds / Invalid Coordinates
description: >-
  A point at latitude 100°, beyond the valid ±90° range — the classic symptom of swapped
  latitude and longitude (EPSG axis order) in the input.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - invalid
  - out_of_bounds
  - coordinate_error
  - lat_lon_swap

risk_types:
  - crs/lat_lon_swap
  - crs/projection_failure
  - extent/coordinate_range_error
  - format/spatial_index_failure
  - geometry/silent_invalid

behavioral_goal: >
  Expose code that silently accepts coordinates outside valid geographic ranges.
  Latitude must be in [-90, 90], longitude in [-180, 180].
  Values exceeding these ranges indicate data errors or coordinate order swaps.

expected_capabilities:
  - load
  - geometry-validation
  - coordinate-validation

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Undefined -- coordinates fall outside the WGS84 domain"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: false
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  is_valid: false
  coordinate_error_type: out_of_bounds
  latitude_in_file: 100.0
  longitude_in_file: -0.1
