id: empty_polygon
title: Empty Polygon
description: >
  An explicitly empty polygon geometry used to verify that code handles
  empty-but-typed polygon inputs without crashing.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - empty
  - baseline

risk_types:
  - empty_geometry

behavioral_goal: >
  Confirm that geometry utilities gracefully handle Polygon EMPTY inputs.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
