id: empty_polygon
title: Empty Polygon
description: >
  An explicitly empty polygon geometry used to verify that code handles
  empty-but-typed polygon inputs without crashing.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - empty
  - baseline

risk_types:
  - empty_geometry

behavioral_goal: >
  Confirm that geometry utilities gracefully handle Polygon EMPTY inputs.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "No geometry -- the case is deliberately empty"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon
# Plan 38 phase 1.1 -- recorded from the 2026-08-31 six-consumer differential
# run.
known_divergences:
  - consumer: lonboard
    version_range: "lonboard 0.11, geoarrow-pyarrow 0.5"
    description: >
      from_geopandas on an all-empty geometry frame raises
      ValueError: 0-length dimension rather than producing an empty layer.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/38-six-consumer-round-2-and-the-stac-adapter.md
  - consumer: geoarrow-pyarrow
    version_range: "geoarrow-pyarrow 0.5"
    description: >
      as_geoarrow raises an internal AttributeError on an all-empty frame,
      because infer_type_common returns pa.null() and the caller assumes a
      geometry type.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/38-six-consumer-round-2-and-the-stac-adapter.md
