id: empty_geometry_gpkg
title: Empty Geometry in GeoPackage
description: >
  A GeoPackage containing rows with empty geometries (WKB EMPTY representation)
  to test how loaders handle the distinction between NULL geometry and EMPTY
  geometry. In GeoPackage/SQLite, NULL means "no geometry value" while EMPTY
  means "a geometry that contains no coordinates". This case exposes loaders
  that conflate NULL and EMPTY or fail to handle EMPTY geometries correctly.
category: vector
format: GPKG
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - empty
  - geopackage
  - format_specific
  - null_handling
  - geometry_special

risk_types:
  - format/limitation
  - geometry/empty
  - geometry/null_empty_conflation

behavioral_goal: >
  Expose loaders that incorrectly handle EMPTY geometries in GeoPackage format.
  Detect confusion between SQL NULL and WKB EMPTY geometry representations.
  Test filtering and query behavior with empty geometries.

expected_capabilities:
  - load
  - geometry-validation
  - null-handling

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.0
  south: 50.0
  east: 11.0
  north: 51.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic)"

files:
  primary: empty_geom.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: false
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

# Consumer disagreements already investigated. Recorded so a repeat
# differential run reports them as `known` rather than as a fresh finding, and
# so a *newly introduced* bug on this case is still distinguishable.
known_divergences:
  - consumer: pyogrio
    # Observed on pyogrio 0.11 / GDAL 3.13.3 (the external validation run) and
    # again on pyogrio 0.12.1 / GDAL 3.12.2, so it is not one GDAL build.
    version_range: "pyogrio >=0.11, GDAL 3.12-3.13 (originates in GDAL)"
    description: >
      Under a spatial filter (bbox= or mask=), the Arrow path
      (use_arrow=True) returns the NULL-geometry row that the numpy path and
      GDAL's own `ogrinfo -spat` both exclude -- 3 rows against 2. Traced to
      GPKG's GetArrowStream fast path; only GPKG diverges among GeoJSON,
      Shapefile and SQLite. A NULL geometry intersects nothing, so the numpy
      path is the correct one.
    # The filed GDAL issue number is not recorded in this tree, so this points
    # at the report that was filed rather than at a bare issue list. Replace it
    # with the issue URL once that is known.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/geocase_validate/gdal-issue-draft.md
  - consumer: lonboard
    version_range: "lonboard 0.11, geoarrow-pyarrow 0.5"
    # Plan 38 phase 1.1 -- a second, independent finding on the same case, from
    # the 2026-08-31 six-consumer run. Distinct from the pyogrio record above:
    # this one is about the export side, not the spatial-filter read.
    description: >
      from_geopandas emits no Arrow validity bitmap, so a NULL geometry is
      indistinguishable from a geometry with NaN coordinates. geopandas' own
      Arrow export, which does set the bitmap, is the reference.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/38-six-consumer-round-2-and-the-stac-adapter.md

params:
  row_count: 4
  null_geometry_rows: 1
  empty_geometry_rows: 1
  valid_geometry_rows: 2
