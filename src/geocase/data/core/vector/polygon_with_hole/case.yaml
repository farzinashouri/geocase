id: polygon_with_hole
title: Polygon with Hole
description: >
  A polygon containing an interior ring (hole).  Tests that tools
  correctly distinguish outer and inner rings and compute area
  accounting for the hole.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - polygon
  - hole
  - interior_ring

risk_types:
  - incorrect_area
  - ring_ordering

behavioral_goal: >
  Verify that inner rings are preserved on load and that area
  calculations subtract the hole.

expected_capabilities:
  - load
  - geometry-validation
  - area-check

loader_hint: geopandas
geometry_type: Polygon
crs: EPSG:4326

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Polygon

params:
  has_holes: true
  num_interior_rings: 1
