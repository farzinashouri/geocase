id: point_csv_wkt_baseline
title: Point CSV WKT Baseline
description: >
  Canonical baseline point stored as CSV with WKT geometry column for
  cross-format comparison and format-specific loader behavior testing.
category: vector
format: CSV_WKT
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - valid
  - baseline
  - csv
  - wkt
  - cross_format_canonical

risk_types:
  - format_comparison

behavioral_goal: >
  Provide a canonical point encoded as CSV with WKT so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.5
  south: 55.7
  east: 12.5
  north: 55.7

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic)"

files:
  primary: data.csv
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: false
  expected_geometry_types:
    - Point

params:
  canonical_source_case_id: simple_valid_point
  geometry_column: geometry
