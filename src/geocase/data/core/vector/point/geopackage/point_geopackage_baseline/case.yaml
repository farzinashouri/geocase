id: point_geopackage_baseline
title: Point GeoPackage Baseline
description: >
  Canonical baseline point stored as a GeoPackage for cross-format
  comparison and format-specific loader behavior testing.
category: vector
format: GPKG
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - valid
  - baseline
  - geopackage
  - cross_format_canonical
  - format_comparison

risk_types: []

behavioral_goal: >
  Provide a canonical point encoded as a GeoPackage so format-specific
  loader behavior can be compared directly against the GeoJSON baseline.

expected_capabilities:
  - load
  - geometry-validation
  - bounds-check

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 174.78
  south: -41.29
  east: 174.78
  north: -41.29

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Wellington, New Zealand (synthetic)"

files:
  primary: data.gpkg
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  canonical_source_case_id: simple_valid_point
