id: simple_valid_point
title: Simple Valid Point
description: >
  A straightforward Point in EPSG:4326 used as the canonical baseline
  for point-loading and cross-format comparison behavior.
category: vector
format: GeoJSON
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - valid
  - baseline

risk_types:
  - none

behavioral_goal: >
  Confirm that a basic point fixture is discoverable and loadable
  through the catalog and vector loader.

expected_capabilities:
  - load
  - geometry-validation
  - reprojection

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 174.78
  south: -41.29
  east: 174.78
  north: -41.29

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Wellington, New Zealand (synthetic)"

files:
  primary: geometry.geojson
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  expected_feature_count: 1
