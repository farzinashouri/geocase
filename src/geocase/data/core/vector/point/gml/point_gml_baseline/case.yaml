id: point_gml_baseline
title: Point GML Baseline
description: >
  Canonical baseline point stored as GML to exercise XML-based vector
  loading with explicit CRS metadata.
category: vector
format: GML
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - vector
  - point
  - valid
  - baseline
  - gml
  - cross_format_canonical
  - format_comparison

risk_types:
  # Added in plan 34. These files are written with
  # urn:ogc:def:crs:EPSG::4326, and the URN form forces EPSG:4326's declared
  # (latitude, longitude) axis order regardless of GDAL's traditional-order
  # setting -- so the bytes on disk really are lat-first. OGR reads them back
  # correctly; a naive text parse of the XML does not. See notes.md.
  - crs/axis_order
  - format/xml_driver_behavior

behavioral_goal: >
  Provide a canonical point encoded as GML so XML-driver loading can be
  compared against simpler baseline vector formats.

expected_capabilities:
  - load
  - geometry-validation
  - reprojection

loader_hint: geopandas
geometry_type: Point
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 174.78
  south: -41.29
  east: 174.78
  north: -41.29

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Wellington, New Zealand (synthetic)"

files:
  primary: geometry.gml
  sidecars:
    # Written by OGR alongside the .gml and hashed by generate_checksums.py,
    # but undeclared until plan 13 -- and validate_catalog.py only checks
    # files a case declares, so a missing schema would have shipped unnoticed.
    - geometry.xsd
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_valid_geometry: true
  expect_crs: true
  expected_epsg: 4326
  expected_geometry_types:
    - Point

params:
  # Replaces a hand-written ``canonical_location: {lon: 10.5, lat: 50.5}``. That
  # literal was read by nothing, matched no other case in the family, and was the
  # sole reason 60 cases carried ``cross_format_canonical`` while only 59 declared
  # a source. The geometry now comes from the case named here.
  canonical_source_case_id: simple_valid_point
