id: pixel_is_area_dem_small
title: Pixel-Is-Area DEM
description: >
  The control half of the pixel-anchor pair. Declares AREA_OR_POINT=Area,
  so the transform's coordinates name pixel corners. Written explicitly
  rather than relying on GDAL's default, which omits the tag entirely --
  a silent file cannot serve as one half of a differential.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - pixel-anchor
  - georeferencing

risk_types:
  - nodata/ignored
  - transform/pixel_anchor

behavioral_goal: >
  Verify that a consumer reads AREA_OR_POINT rather than assuming one
  convention. Against pixel_is_point_dem_small -- identical array, identical
  transform -- the same pixel sits half a pixel away.

expected_capabilities:
  - load
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 37.94759
  east: 15.004098
  north: 37.950834

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Mediterranean (synthetic, UTM 33N)"

files:
  primary: pixel_is_area_dem_small.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [12, 12]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_transform_signs:
    - negative_e
  expected_pixel_anchor: area
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 72.0
  expected_mean_naive: 2.0625
  nodata_pixel_count: 1
  expected_bounds: [500000.0, 4200000.0, 500360.0, 4200360.0]
