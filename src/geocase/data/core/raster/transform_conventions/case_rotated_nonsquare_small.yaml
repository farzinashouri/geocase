id: rotated_nonsquare_small
title: Rotated Raster with Non-Square Pixels
description: >
  A raster rotated about 25 degrees with a skew sign opposite to
  rotated_two_islands and pixels that are 30 m by 20 m rather than square.
  rotated_two_islands was 2-for-2 across two validation runs and three
  libraries and was still the only rotated raster in the corpus, so "handles
  rotation" and "handles *this* rotation" were indistinguishable. The
  non-square pixels are deliberate: a scalar resolution= cannot express them,
  so a harness passing one silently squares the grid.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - rotated
  - georeferencing

risk_types:
  - affine_transform_bug
  - nonsquare_pixel_assumption

behavioral_goal: >
  Confirm that a consumer honours both skew terms and a non-square pixel size
  at once, so that squaring the grid or dropping the rotation is a visible
  wrong answer rather than a one-pixel edge effect.

expected_capabilities:
  - load
  - affine-transform-check
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 14.9988
  south: 40.648897
  east: 15.003859
  north: 40.652227

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: rotated_nonsquare_small.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [12, 12]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_band_names: [elevation]
  expected_transform_signs:
    - negative_e
    - rotated

params:
  generator: scripts/generate_raster_fixtures.py
  x_pixel_size: 30.0
  y_pixel_size: 20.0
  rotation_degrees: 25.0
