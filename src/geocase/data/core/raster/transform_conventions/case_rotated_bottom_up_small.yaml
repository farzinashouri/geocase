id: rotated_bottom_up_small
title: Rotated Bottom-Up DEM (Skew and Positive Y Resolution)
description: >
  A DEM carrying both transform conventions at once: a rotated affine with
  non-zero b/d skew terms AND a positive e, so the origin is the bottom-left
  corner and row 0 is the southernmost row. The catalog previously held one
  rotated raster and one bottom-up raster and no case combining them, so a
  consumer could handle either convention alone and appear correct.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - rotated
  - south-up
  - georeferencing

risk_types:
  - affine_transform_bug

behavioral_goal: >
  Verify that a consumer reads rotation and row order from the same affine,
  rather than handling one convention and silently normalising the other.
  rio-tiler's rotated-affine and bottom-up defects have adjacent root causes
  and a single WarpedVRT guard addresses both; this case is what distinguishes
  a complete fix from a partial one.

expected_capabilities:
  - load
  - affine-transform-check
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 37.947589
  east: 15.00519
  north: 37.951699

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Mediterranean (synthetic, UTM 33N)"

files:
  primary: rotated_bottom_up_small.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [12, 12]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_transform_signs:
    - positive_e
    - rotated
