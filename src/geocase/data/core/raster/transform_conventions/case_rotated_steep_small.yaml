id: rotated_steep_small
title: Steeply Rotated DEM (40-Degree Skew)
description: >
  A DEM rotated by roughly 40 degrees, against the ~14 degrees of
  rotated_two_islands. At this angle a consumer assuming a north-up affine
  misplaces the grid's far corner by about ten cells rather than one, so the
  error reads as a wrong answer with a legible direction rather than as a
  one-pixel edge effect.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - rotated
  - georeferencing

risk_types:
  - affine_transform_bug

behavioral_goal: >
  Confirm that a consumer honours the affine's skew terms at an angle large
  enough that ignoring them displaces pixels by several cells, making the
  magnitude and direction of the error visible in a differential report.

expected_capabilities:
  - load
  - affine-transform-check
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 14.997366
  south: 37.946263
  east: 15.003139
  north: 37.950834

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Mediterranean (synthetic, UTM 33N)"

files:
  primary: rotated_steep_small.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [12, 12]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_transform_signs:
    - negative_e
    - rotated
