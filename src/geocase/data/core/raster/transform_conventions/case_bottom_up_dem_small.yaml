id: bottom_up_dem_small
title: Bottom-Up DEM (Positive Y Resolution)
description: >
  A south-up GeoTIFF whose affine transform has a positive e term: the
  origin is the bottom-left corner and row 0 is the southernmost row.
  Every other raster in the catalog is north-up, so code that assumes
  a negative e passes the whole corpus and then flips this one.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - south-up
  - georeferencing

risk_types:
  - nodata/ignored
  - transform/bottom_up

behavioral_goal: >
  Verify that a consumer reads row order from the transform rather than
  assuming north-up, and that it orders bounds explicitly instead of
  trusting bounds.bottom to be the smaller northing.

expected_capabilities:
  - load
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 37.94759
  east: 15.004098
  north: 37.950834

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Mediterranean (synthetic, UTM 33N)"

files:
  primary: bottom_up_dem_small.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [12, 12]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_transform_signs:
    - positive_e
  expected_pixel_anchor: area
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 72.0
  expected_mean_naive: 2.0625
  nodata_pixel_count: 1
  expected_bounds: [500000.0, 4200360.0, 500360.0, 4200000.0]
# Plan 38 phase 1.1 -- recorded from the 2026-08-31 six-consumer differential
# run. Two independent consumers mishandle this case's bottom-up affine.
known_divergences:
  # Plan 37 phase 1.1 -- the 2026-08-31 four-consumer run.
  - consumer: rio-tiler
    version_range: "rio-tiler 9.4.3, GDAL 3.12.2"
    description: >
      The positive-e affine is valid and rasterio reads it, but rio-tiler
      propagates the inverted BoundingBox (bottom > top) onto Reader.bounds, so
      bounds[3] - bounds[1] is negative. feature() then raises WindowError while
      part() over the identical area succeeds. reader.py:487 calls
      windows.from_bounds with no ordering normalisation, and reader.py:58
      computes y_res = (bounds[3] - bounds[1]) / height with no abs().
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/37-raster-signal-and-differential-adapters.md
  - consumer: titiler
    version_range: "titiler 0.24 / rio-tiler 8.x, GDAL 3.12.2"
    description: >
      /cog/info returns bounds with miny > maxy for the bottom-up (positive e)
      affine, and the normalised /cog/bbox request built from those bounds then
      returns HTTP 500 rather than the window.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/38-six-consumer-round-2-and-the-stac-adapter.md
  - consumer: rio-stac
    version_range: "rio-stac 0.11, GDAL 3.12.2"
    description: >
      create_stac_item writes proj:bbox unnormalised for the bottom-up affine,
      so the Item is invalid per the projection extension even though the
      WGS84 bbox it writes alongside is correct.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/38-six-consumer-round-2-and-the-stac-adapter.md
