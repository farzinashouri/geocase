id: multispectral_mixed_resolution_small
title: Multispectral Mixed Resolution Small
description: >
  A tiny three-band uint16 Sentinel-2 L2A stack (B04, B08, B11) on a common
  10 m grid, where B11 is 20 m-native and carried as 2x2 block-replicated
  values — so the resolution mismatch exists in the pixels, not only in the
  metadata. Baseline 04.00 radiometry as in multispectral_s2_like_small.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - multispectral
  - mixed-resolution
  - product:multispectral
  - geography:utm
  - delivery:resampled-stack

risk_types:
  - resolution_mismatch
  - resampling_assumptions
  - band_loss

behavioral_goal: >
  Confirm GeoCase preserves a multispectral stack assembled from bands of
  differing native resolutions resampled to a common grid.

expected_capabilities:
  - load
  - multiband-read

loader_hint: rasterio
crs: EPSG:32633

files:
  primary: multispectral_mixed_resolution_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 0
  nodata_convention: sentinel
  expected_band_count: 3
  expected_dtype: uint16
  expected_shape: [16, 16]
  expected_band_names: [B04, B08, B11]
  expected_scale_factor: 1.0e-4
  expected_compression: deflate

params:
  generator: scripts/generate_raster_fixtures.py
  synth: geocase.raster.presets.sentinel2_l2a
  processing_baseline: "04.00"
  resolutions:
    B04: 10
    B08: 10
    B11: 20
