id: geotiff_int32_small
title: GeoTIFF Int32 Small
description: >
  A small single-band GeoTIFF stored as signed 32-bit integers. Tests that
  raster loaders and downstream code preserve wide integer dtype semantics
  rather than truncating values to smaller types.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - dtype
  - int32

risk_types:
  - dtype_coercion
  - range_truncation
  - nodata_ignored

behavioral_goal: >
  Confirm that signed 32-bit integer rasters open with the correct dtype and
  preserve their declared numeric storage type through simple reads.

expected_capabilities:
  - load
  - dtype-check
  - nodata-check

loader_hint: rasterio
crs: EPSG:32633

files:
  primary: int32_sample.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true

params:
  nodata_value: -9999
  band_count: 1
  dtype: int32
