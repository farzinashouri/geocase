id: landcover_small
title: Land Cover Small
description: >-
  A categorical land-cover raster where 0 is NoData, not a class. Resampling or averaging
  categorical values silently invents classes that do not exist.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - landcover
  - categorical
  - product:landcover
  - geography:utm
  - delivery:single-file

risk_types:
  - colormap_dropped
  - category_misread

behavioral_goal: >
  Confirm GeoCase preserves a categorical land-cover raster and its colormap.
  Every pixel is classified and the raster declares no NoData, because 0
  doubling as both a class and a sentinel is a distinct risk that belongs in a
  case of its own rather than in a silent declaration here. That case is
  ``landcover_ambiguous_zero_small``: the same scene with the ambiguity put
  back, so the pair isolates the collision (Plan 28, Plan 32).

expected_capabilities:
  - load
  - colormap-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: landcover_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_band_count: 1
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [landcover]
  expected_compression: deflate
  expected_colormap_present: true

params:
  generator: scripts/generate_raster_fixtures.py
# Plan 38 phase 1.1 -- recorded from the 2026-08-31 six-consumer differential
# run.
known_divergences:
  - consumer: titiler
    version_range: "titiler 0.24 / rio-tiler 8.x, GDAL 3.12.2"
    description: >
      /preview.npy and /preview.tif return the dataset's colormap applied as
      RGB rather than the class codes, so the categorical values are
      unrecoverable from the response. Applies equally to
      landcover_ambiguous_zero_small.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/38-six-consumer-round-2-and-the-stac-adapter.md
