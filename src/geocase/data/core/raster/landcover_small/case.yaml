id: landcover_small
title: Land Cover Small
description: >
  A tiny single-band uint8 categorical land-cover raster with an attached
  colormap (0=nodata, 1=water, 2=vegetation, 3=urban). Exercises categorical /
  colormap handling.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - landcover
  - categorical
  - product:landcover
  - geography:utm
  - delivery:single-file

risk_types:
  - colormap_dropped
  - category_misread
  - nodata_ignored

behavioral_goal: >
  Confirm GeoCase preserves a categorical land-cover raster, its colormap, and
  its NoData class.

expected_capabilities:
  - load
  - colormap-check
  - nodata-check

loader_hint: rasterio
crs: EPSG:32633

files:
  primary: landcover_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 0
  nodata_convention: sentinel
  expected_band_count: 1
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [landcover]
  expected_compression: deflate
  expected_colormap_present: true

params:
  generator: scripts/generate_raster_fixtures.py
