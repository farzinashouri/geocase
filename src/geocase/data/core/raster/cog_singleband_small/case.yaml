id: cog_singleband_small
title: COG Single-Band Small
description: >
  A tiny single-band uint16 Cloud-Optimized GeoTIFF: internally tiled with a
  single overview level. Exercises COG-style structural detection.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - cog
  - product:cog
  - geography:utm
  - delivery:cloud-optimized

risk_types:
  - dtype/drift
  - format/not_tiled
  - format/overviews_missing

behavioral_goal: >
  Confirm GeoCase recognises an internally tiled, overview-bearing single-band
  GeoTIFF as COG-structured.

expected_capabilities:
  - load
  - cog-check
  - overview-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.645091
  east: 15.00757
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: cog_singleband_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_band_count: 1
  expected_dtype: uint16
  expected_shape: [64, 64]
  expected_compression: deflate
  expected_overviews: true
  is_cog: true
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  nodata_pixel_count: 0
  expected_bounds: [500000.0, 4499360.0, 500640.0, 4500000.0]
params:
  generator: scripts/generate_raster_fixtures.py
