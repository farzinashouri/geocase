id: optical_polar_small
title: Optical Polar Small
description: >-
  An RGB scene in polar stereographic EPSG:3995. Exercises the CRS assumptions that break when
  code presumes every raster is in EPSG:4326 or UTM.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - optical
  - product:optical
  - geography:polar
  - delivery:single-file

risk_types:
  - crs_mishandled
  - projection_assumptions

behavioral_goal: >
  Confirm GeoCase handles an RGB optical scene in a polar stereographic CRS.

expected_capabilities:
  - load
  - crs-check

loader_hint: rasterio
crs: EPSG:3995

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: -135.002292
  south: 64.386164
  east: -134.997708
  north: 64.388148

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Arctic, northern Alaska"

files:
  primary: optical_polar_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 3995
  expected_band_count: 3
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [red, green, blue]
  expected_compression: deflate

params:
  generator: scripts/generate_raster_fixtures.py
