id: crs_family_pair_geographic
title: CRS Family Pair -- Geographic (WGS 84)
description: >
  One half of a matched pair describing the same ground in two CRS families:
  this is the geographic half, derived by reprojecting the projected one, in degrees. 31 of the corpus's 34 rasters were EPSG:32633,
  which made any "same case, two CRSs" assertion untestable and left
  reprojection sweeps leaning entirely on the *target* CRS for variation. The
  pair makes the unit-change axis assertable from inside the corpus.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - crs
  - reprojection
  - pair

risk_types:
  - crs_unit_confusion
  - reprojection_error

behavioral_goal: >
  Confirm that a consumer reading both halves agrees about the ground they
  describe, so that a resolution or bounds option interpreted in the wrong
  linear unit shows up as a disagreement between the two rather than as a
  plausible-looking single answer.

expected_capabilities:
  - load
  - crs-check
  - reprojection-check

loader_hint: rasterio
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.646441
  east: 15.005677
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, WGS 84)"

files:
  primary: crs_family_pair_geographic.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 4326
  expected_shape: [14, 18]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_band_names: [elevation]

params:
  generator: scripts/generate_raster_fixtures.py
  pair: crs_family_pair
  pair_role: geographic
  linear_unit: degrees
