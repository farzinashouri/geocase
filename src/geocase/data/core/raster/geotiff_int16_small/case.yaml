id: geotiff_int16_small
title: GeoTIFF Int16 Small
description: >
  A small single-band GeoTIFF stored as signed 16-bit integers. Tests that
  raster loaders and downstream code preserve medium-range integer dtype
  semantics without silently widening or converting values.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - dtype
  - int16

risk_types:
  - dtype/coercion
  - dtype/range_assumption
  - nodata/ignored

behavioral_goal: >
  Confirm that signed 16-bit integer rasters open with the correct dtype and
  preserve their declared numeric storage type through simple reads.

expected_capabilities:
  - load
  - dtype-check
  - nodata-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 0.008143
  east: 15.000899
  north: 0.009047

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Equator, Gulf of Guinea (synthetic)"

files:
  primary: int16_sample.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_shape: [10, 10]
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 198.9795918367
  expected_mean_naive: -4.98
  nodata_pixel_count: 2
  expected_bounds: [500000.0, 900.0, 500100.0, 1000.0]
params:
  nodata_value: -9999
  band_count: 1
  dtype: int16
