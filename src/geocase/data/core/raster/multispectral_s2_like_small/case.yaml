id: multispectral_s2_like_small
title: Multispectral Sentinel-2-like Small
description: >
  A tiny four-band uint16 multispectral scene approximating a Sentinel-2 band
  stack (blue, green, red, NIR). Exercises multispectral band handling and a
  sentinel NoData value of 0.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - multispectral
  - sentinel2
  - product:multispectral
  - geography:utm
  - delivery:single-file

risk_types:
  - band_loss
  - incorrect_band_order
  - nodata_ignored
  - dtype_drift

behavioral_goal: >
  Confirm GeoCase preserves a four-band uint16 multispectral stack, its band
  ordering, and its sentinel NoData convention.

expected_capabilities:
  - load
  - multiband-read
  - nodata-check
  - band-name-check

loader_hint: rasterio
crs: EPSG:32633

files:
  primary: multispectral_s2_like_small.tif
  notes: notes.md

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 0
  nodata_convention: sentinel
  expected_band_count: 4
  expected_dtype: uint16
  expected_shape: [16, 16]
  expected_band_names: [blue, green, red, nir]
  expected_compression: deflate

params:
  generator: scripts/generate_raster_fixtures.py
