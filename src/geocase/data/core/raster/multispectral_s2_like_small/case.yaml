id: multispectral_s2_like_small
title: Multispectral Sentinel-2-like Small
description: >
  A tiny four-band uint16 Sentinel-2 L2A stack (B02, B03, B04, B08) with
  processing-baseline 04.00 radiometry: sentinel NoData 0, band scale 1e-4
  with offset -0.1 (BOA reflectance = (DN - 1000) / 10000), and
  BOA_ADD_OFFSET / QUANTIFICATION_VALUE / PROCESSING_BASELINE product tags.
  Generated by geocase.raster.presets, whose constants are machine-checked against a
  real granule's MTD_MSIL2A.xml (tests/synth/test_spec_fidelity.py).
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - multispectral
  - sentinel2
  - product:multispectral
  - geography:utm
  - delivery:single-file

risk_types:
  - band/incorrect_order
  - band/loss
  - dtype/drift
  - nodata/ignored

behavioral_goal: >
  Confirm GeoCase preserves a four-band uint16 multispectral stack, its band
  ordering, and its sentinel NoData convention.

expected_capabilities:
  - load
  - multiband-read
  - nodata-check
  - band-name-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: multispectral_s2_like_small.tif
  notes: notes.md

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 0
  nodata_convention: sentinel
  expected_band_count: 4
  expected_dtype: uint16
  expected_shape: [16, 16]
  expected_band_names: [B02, B03, B04, B08]
  expected_scale_factor: 1.0e-4
  expected_compression: deflate
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 4140.306122449
  expected_mean_naive: 3169.921875
  nodata_pixel_count: 240
  expected_bounds: [500000.0, 4499840.0, 500160.0, 4500000.0]
params:
  generator: scripts/generate_raster_fixtures.py
  synth: geocase.raster.presets.sentinel2_l2a
  processing_baseline: "04.00"
  boa_add_offset: -1000
  quantification_value: 10000
