id: geotiff_nodata_small
title: GeoTIFF NoData Small
description: >-
  A GeoTIFF with an explicit NoData sentinel. Statistics computed over the raw array rather
  than the valid pixels are silently wrong — a classic raster bug.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - nodata
  - masking

risk_types:
  - data/nan_propagation
  - measurement/incorrect_statistics
  - nodata/ignored

behavioral_goal: >
  Confirm that NoData pixels are correctly masked and excluded from
  statistical computations (min, max, mean).

expected_capabilities:
  - load
  - nodata-check
  - statistics

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 50.551847
  east: 15.141426
  north: 50.641864

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic, UTM 33N)"

files:
  primary: nodata_sample.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_shape: [10, 10]
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 48.0787352901
  expected_mean_naive: -152.8628394157
  nodata_pixel_count: 2
  expected_bounds: [500000.0, 5600000.0, 510000.0, 5610000.0]
params:
  nodata_value: -9999
  band_count: 1
  dtype: float32
