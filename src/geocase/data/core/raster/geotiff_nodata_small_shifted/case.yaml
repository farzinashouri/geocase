id: geotiff_nodata_small_shifted
title: GeoTIFF NoData Small Shifted
description: >
  A copy of the small NoData GeoTIFF shifted exactly one pixel east
  while preserving CRS, resolution, band structure, and pixel values.
  Useful for testing whether raster alignment logic recognizes grids
  that are aligned on the same pixel lattice but have different extents.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - nodata
  - alignment
  - affine_transform

risk_types:
  - scaling/pixel_lattice_misclassification
  - transform/alignment_too_strict
  - transform/shifted_origin

behavioral_goal: >
  Expose alignment helpers that require identical extents instead of
  recognizing rasters that share the same pixel lattice with an integer-pixel offset.

expected_capabilities:
  - load
  - affine-check
  - alignment-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.014116
  south: 50.551829
  east: 15.155568
  north: 50.641863

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic, UTM 33N)"

files:
  primary: nodata_sample_shifted.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_shape: [10, 10]
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 48.0787352901
  expected_mean_naive: -152.8628394157
  nodata_pixel_count: 2
  expected_bounds: [501000.0, 5600000.0, 511000.0, 5610000.0]
params:
  aligned_with_case: geotiff_nodata_small
  x_shift_pixels: 1
  band_count: 1
  dtype: float32
