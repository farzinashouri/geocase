id: geotiff_utm_boundary
title: GeoTIFF UTM Boundary
description: >-
  A GeoTIFF straddling a UTM zone boundary. Mosaicking or reprojecting across the seam produces
  pixel shifts and CRS mismatches between adjacent tiles.
category: raster
format: GeoTIFF
test_tier: unit
size_class: small
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - utm
  - crs
  - reprojection
  - boundary

risk_types:
  - zone_boundary_artifact
  - reprojection_error
  - pixel_shift

behavioral_goal: >
  Detect raster code that assumes the entire tile lives in a single
  UTM zone, causing distortion or misalignment at zone edges.

expected_capabilities:
  - load
  - reprojection
  - bounds-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 14.858304
  south: 50.551847
  east: 15.141696
  north: 50.731793

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic, UTM 33N)"

files:
  primary: utm_boundary.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [20, 20]

params:
  spans_utm_zones: true
  band_count: 1
