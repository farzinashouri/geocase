id: sar_dualpol_small
title: SAR Dual-Pol Small
description: >
  A tiny two-band Sentinel-1 IW GRDH-like scene (VV, VH): uint16
  detected-amplitude DNs (not dB, not calibrated backscatter), zero-valued
  border-noise columns, sentinel NoData 0. Generated by geocase.raster.presets, whose
  constants are machine-checked against a real S1A GRD annotation.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - sar
  - product:sar
  - geography:utm
  - delivery:single-file

risk_types:
  - band/incorrect_order
  - band/loss
  - dtype/drift

behavioral_goal: >
  Confirm GeoCase preserves a dual-pol VV/VH SAR scene, its band ordering, and
  band naming.

expected_capabilities:
  - load
  - multiband-read
  - band-name-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: sar_dualpol_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 0
  nodata_convention: sentinel
  expected_band_count: 2
  expected_dtype: uint16
  expected_shape: [16, 16]
  expected_band_names: [VV, VH]
  expected_compression: deflate
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 154.4151785714
  expected_mean_naive: 135.11328125
  nodata_pixel_count: 64
  expected_bounds: [500000.0, 4499840.0, 500160.0, 4500000.0]
params:
  generator: scripts/generate_raster_fixtures.py
  synth: geocase.raster.presets.sentinel1_grd
  pixel_value: Detected
  units: amplitude
