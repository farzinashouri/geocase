id: dem_small
title: DEM Small
description: >
  A tiny single-band float32 digital elevation model with a NaN NoData pixel.
  Exercises continuous-surface raster handling and the NaN NoData convention.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - dem
  - terrain
  - product:dem
  - geography:utm
  - delivery:single-file

risk_types:
  - dtype/drift
  - nodata/ignored
  - nodata/nan_mishandled

behavioral_goal: >
  Confirm GeoCase can open a float32 DEM, preserve its single band, and treat
  the NaN NoData value correctly during terrain logic.

expected_capabilities:
  - load
  - nodata-check
  - nan-nodata-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: dem_small.tif
  notes: notes.md

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  nodata_convention: nan
  expected_band_count: 1
  expected_dtype: float32
  expected_shape: [16, 16]
  expected_band_names: [elevation]
  expected_compression: deflate
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 152.2941176471
  expected_mean_naive: 152.2941176471
  nodata_pixel_count: 1
  expected_bounds: [500000.0, 4499840.0, 500160.0, 4500000.0]
params:
  generator: scripts/generate_raster_fixtures.py
