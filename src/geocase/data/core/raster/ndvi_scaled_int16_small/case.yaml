id: ndvi_scaled_int16_small
title: NDVI Scaled Int16 Small
description: >-
  An int16 NDVI raster with a 0.0001 scale factor and a NoData value. Reading the raw integers
  without applying scale_factor yields NDVI in the thousands.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - ndvi
  - derived
  - product:ndvi
  - geography:utm
  - delivery:single-file

risk_types:
  - scale_factor_ignored
  - dtype_drift
  - nodata_ignored

behavioral_goal: >
  Confirm GeoCase preserves a scaled int16 NDVI product, its scale factor, and
  its NoData sentinel.

expected_capabilities:
  - load
  - scale-factor-check
  - nodata-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: ndvi_scaled_int16_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: -32768
  nodata_convention: sentinel
  expected_band_count: 1
  expected_dtype: int16
  expected_shape: [16, 16]
  expected_band_names: [ndvi]
  expected_compression: deflate
  expected_scale_factor: 0.0001

params:
  generator: scripts/generate_raster_fixtures.py
  # The same failure mode in the other container. Packing metadata lives in a
  # GDAL band scale here and in a CF variable attribute there, and libraries
  # routinely handle one and not the other.
  analogous_case_id: ndvi_packed_netcdf
