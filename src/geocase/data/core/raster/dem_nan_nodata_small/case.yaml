id: dem_nan_nodata_small
title: DEM NaN NoData Small
description: >-
  A float32 DEM that marks NoData with NaN rather than a sentinel value. NaN propagates through
  means and comparisons instead of being excluded.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - dem
  - product:dem
  - geography:utm
  - delivery:single-file

risk_types:
  - nodata/ignored
  - nodata/nan_mishandled

behavioral_goal: >
  Confirm GeoCase detects NaN-encoded NoData in a float DEM rather than
  treating NaN as valid elevation.

expected_capabilities:
  - load
  - nodata-check
  - nan-nodata-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: dem_nan_nodata_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  nodata_convention: nan
  expected_band_count: 1
  expected_dtype: float32
  expected_shape: [16, 16]
  expected_band_names: [elevation]
  expected_compression: deflate
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 110.0
  expected_mean_naive: 110.0
  nodata_pixel_count: 2
  expected_bounds: [500000.0, 4499840.0, 500160.0, 4500000.0]
params:
  generator: scripts/generate_raster_fixtures.py
