id: landcover_ambiguous_zero_small
title: Land Cover With Ambiguous Zero
description: >-
  A categorical land-cover raster that declares NoData = 0 while 0 is also a real
  class ("unclassified / bare"). Masking on ``data == nodata`` silently deletes a
  legitimate class; ignoring NoData treats sentinel pixels as data. Nothing in the
  file tells the two apart.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - landcover
  - categorical
  - nodata
  - product:landcover
  - geography:utm
  - delivery:single-file

risk_types:
  - ambiguous_zero
  - nodata_ignored
  - category_misread

behavioral_goal: >
  Surface the sentinel/class collision at 0. The sibling case ``landcover_small``
  is the same scene with the ambiguity removed — every pixel classified and no
  NoData declared — so the pair isolates the collision itself: any difference in
  how your code treats the two files is the ambiguity acting on it (Plan 32).

expected_capabilities:
  - load
  - nodata-check
  - colormap-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: landcover_ambiguous_zero_small.tif
  notes: notes.md

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expect_nodata: true
  expected_epsg: 32633
  expected_nodata_value: 0
  expected_band_count: 1
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [landcover]
  expected_compression: deflate
  expected_colormap_present: true

params:
  generator: scripts/generate_raster_fixtures.py
  sibling_case: landcover_small
