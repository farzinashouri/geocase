id: optical_dateline_small
title: Optical Dateline Small
description: >-
  An RGB GeoTIFF whose bounds straddle the antimeridian at +180 longitude. Exercises bounds
  normalization and antimeridian splitting on raster inputs.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - optical
  - product:optical
  - geography:dateline
  - delivery:single-file

risk_types:
  - antimeridian_split
  - bounds_normalization

behavioral_goal: >
  Confirm GeoCase handles an RGB optical scene whose extent crosses the
  antimeridian.

expected_capabilities:
  - load
  - crs-check

loader_hint: rasterio
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 179.9
  south: 0.68
  east: -179.78
  north: 1.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Antimeridian, North Pacific"

files:
  primary: optical_dateline_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 4326
  expected_band_count: 3
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [red, green, blue]
  expected_compression: deflate

params:
  generator: scripts/generate_raster_fixtures.py
# Plan 38 phase 1.1 -- recorded from the 2026-08-31 six-consumer differential
# run.
known_divergences:
  - consumer: titiler
    version_range: "titiler 0.24 / rio-tiler 8.x, GDAL 3.12.2"
    description: >
      TileJSON bounds/center and /info.geojson carry longitudes greater than
      180 for this unwrapped antimeridian-crossing raster, which is out of
      spec for both formats. bounds_to_geometry handles only the wrapped
      (minx > maxx) convention.
    upstream_url: https://github.com/farzinashouri/geocase/blob/main/docs/plans/38-six-consumer-round-2-and-the-stac-adapter.md
