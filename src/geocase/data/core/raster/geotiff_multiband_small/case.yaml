id: geotiff_multiband_small
title: GeoTIFF Multi-Band Small
description: >-
  A three-band GeoTIFF with NoData in every band. Exercises band-order preservation and
  per-band NoData handling on multiband raster reads.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - multiband
  - bands

risk_types:
  - band_loss
  - incorrect_band_order
  - nodata_ignored

behavioral_goal: >
  Confirm that GeoCase can open a small multi-band raster, preserve its
  declared band count, and expose each band as distinct pixel data.

expected_capabilities:
  - load
  - multiband-read
  - nodata-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 0.008143
  east: 15.000899
  north: 0.009047

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Equator, Gulf of Guinea (synthetic)"

files:
  primary: multiband_sample.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_shape: [10, 10]

params:
  nodata_value: -9999
  band_count: 3
  dtype: float32
