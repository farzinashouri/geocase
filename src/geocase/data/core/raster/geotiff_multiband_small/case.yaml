id: geotiff_multiband_small
title: GeoTIFF Multi-Band Small
description: >-
  A three-band GeoTIFF with NoData in every band. Exercises band-order preservation and
  per-band NoData handling on multiband raster reads.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - multiband
  - bands

risk_types:
  - band/incorrect_order
  - band/loss
  - nodata/ignored

behavioral_goal: >
  Confirm that GeoCase can open a small multi-band raster, preserve its
  declared band count, and expose each band as distinct pixel data.

expected_capabilities:
  - load
  - multiband-read
  - nodata-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 0.008143
  east: 15.000899
  north: 0.009047

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Equator, Gulf of Guinea (synthetic)"

files:
  primary: multiband_sample.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_shape: [10, 10]
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 149.9489795918
  expected_mean_naive: -53.03
  nodata_pixel_count: 6
  expected_bounds: [500000.0, 900.0, 500100.0, 1000.0]
params:
  nodata_value: -9999
  band_count: 3
  dtype: float32
