id: overlap_group_south
title: Overlap Group -- South
description: >
  One of three small rasters sharing a CRS and a pixel grid, with deliberate
  partial overlap and a distinct constant value each. This is the southernmost member, and the only unambiguous band alias. The three
  exist only as a group: odc.stac.load and stackstac.stack take a *sequence* of
  Items and their whole reason for existing is what happens across it, which no
  standalone raster case in this corpus could express.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - group
  - overlap
  - mosaic
  - stac
  - delivery:multi-file

risk_types:
  - stacking_order_ignored
  - band_alias_ambiguity
  - nodata_ignored

behavioral_goal: >
  Confirm that a consumer compositing this group across its overlaps produces a
  result whose provenance is readable: each member carries one constant value,
  so which member won a given pixel is visible by inspection rather than by
  arithmetic.

expected_capabilities:
  - load
  - multi-item-stack
  - nodata-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.004258
  south: 40.64437
  east: 15.008516
  north: 40.647613

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: overlap_group_south.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [12, 12]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_band_names: [nir]

params:
  generator: scripts/generate_raster_fixtures.py
  group: overlap_group
  group_members: ['overlap_group_north', 'overlap_group_centre', 'overlap_group_south']
  stack_order: 3
  common_name: nir
  constant_value: 30.0
