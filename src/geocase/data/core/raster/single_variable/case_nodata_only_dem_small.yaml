id: nodata_only_dem_small
title: Nodata Only (One Sentinel, North-Up, Unrotated)
description: >
  A north-up 8x8 DEM whose only unusual property is two interior -9999
  sentinel pixels. No rotation, no bottom-up affine, no ambiguity about
  whether the sentinel is also a legitimate value. The two sentinels sit in
  the interior rather than on the border, so a consumer that crops edges
  cannot skip past them.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - nodata
  - dem
  - single-variable
  - control

risk_types:
  - nodata/ignored

behavioral_goal: >
  Separate "the consumer forgot to mask" from every other reason a statistic
  can be wrong. The case declares both means, and the gap between them is the
  defect: a consumer that ignores nodata reproduces expected_mean_naive, and
  one that masks correctly reproduces expected_mean_masked.

expected_capabilities:
  - load
  - nodata-check
  - statistics-check
  - bounds-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.456813
  south: 45.125154
  east: 12.458909
  north: 45.126638

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Mediterranean (synthetic, UTM 33N)"

files:
  primary: nodata_only_dem_small.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [8, 8]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_transform_signs:
    - negative_e
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 31.4838709677
  expected_mean_naive: -281.96875
  nodata_pixel_count: 2
  expected_bounds: [300000.0, 5000000.0, 300160.0, 5000160.0]

params:
  generator: scripts/generate_raster_fixtures.py
  isolates: nodata
