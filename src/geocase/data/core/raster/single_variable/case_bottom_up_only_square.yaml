id: bottom_up_only_square
title: Bottom-Up Square (Positive E and Nothing Else)
description: >
  A plain filled 8x8 square whose only unusual property is a positive e term:
  row 0 is the southernmost row and the origin is the bottom-left corner. No
  nodata, no rotation. bottom_up_dem_small found defects in two separate
  libraries but also carries a nodata sentinel; this case removes it, so a
  consumer that flips the rows and a consumer that mishandles the sentinel
  cannot be confused for one another.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - south-up
  - georeferencing
  - single-variable
  - control

risk_types:
  - transform/bottom_up

behavioral_goal: >
  Confirm that a consumer reads row order from the transform rather than
  assuming north-up, and orders bounds explicitly instead of trusting
  bounds.bottom to be the smaller northing -- with no second variable that
  could explain a failure instead.

expected_capabilities:
  - load
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.456813
  south: 45.125154
  east: 12.458909
  north: 45.126638

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Mediterranean (synthetic, UTM 33N)"

files:
  primary: bottom_up_only_square.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [8, 8]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: false
  expected_transform_signs:
    - positive_e
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  nodata_pixel_count: 0
  expected_bounds: [300000.0, 5000160.0, 300160.0, 5000000.0]

params:
  generator: scripts/generate_raster_fixtures.py
  isolates: transform_sign
  bundled_counterpart: bottom_up_dem_small
