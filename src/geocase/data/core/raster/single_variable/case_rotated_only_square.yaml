id: rotated_only_square
title: Rotated Square (Rotation and Nothing Else)
description: >
  A plain filled 8x8 square whose only unusual property is a 30-degree
  rotation in its geotransform. No nodata, no sparse islands, no footprint
  question. rotated_two_islands found real defects but bundles rotation with
  two other variables, so a failure there needs an argument about which one
  caused it; this case removes the argument.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - rotated
  - georeferencing
  - single-variable
  - control

risk_types:
  - transform/rotated

behavioral_goal: >
  Prove a consumer's bounds or inverse-affine handling wrong with exactly one
  possible cause. The case ships its own answer -- expected_bounds and a
  pixel/world round trip -- so the consumer asserts against a declared number
  instead of hand-rolling the inverse affine, which is what round 4's only
  irreducible finding actually required.

expected_capabilities:
  - load
  - affine-transform-check
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.455796
  south: 45.124605
  east: 12.45866
  north: 45.126632

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Mediterranean (synthetic, UTM 33N)"

files:
  primary: rotated_only_square.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [8, 8]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: false
  # Both, and the pair is the point: a 30-degree rotation leaves e negative,
  # so this case is north-up *and* rotated. bottom_up_only_square is the one
  # that isolates the sign. Declaring only "rotated" would be a claim the
  # bytes do not support, which the content gate caught.
  expected_transform_signs:
    - negative_e
    - rotated
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  nodata_pixel_count: 0
  expected_bounds: [299920.0, 4999941.435935395, 300138.5640646055, 5000160.0]
  expected_pixel_world_pairs:
    - [0.0, 0.0, 300003.6602540378, 5000146.339745962]
    - [7.0, 7.0, 300054.9038105677, 4999955.096189433]
    - [4.0, 4.0, 300032.9422863406, 5000037.0577136595]

params:
  generator: scripts/generate_raster_fixtures.py
  isolates: rotation
  bundled_counterpart: rotated_two_islands
