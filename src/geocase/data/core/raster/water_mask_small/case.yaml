id: water_mask_small
title: Water Mask Small
description: >-
  A uint8 binary water mask with NoData 255. Code that treats the mask as 0/1 counts NoData
  pixels as water, inflating every areal statistic.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - mask
  - water
  - product:mask
  - geography:utm
  - delivery:single-file

risk_types:
  - dtype/drift
  - nodata/ignored
  - nodata/mask_misread

behavioral_goal: >
  Confirm GeoCase can open a binary water mask, preserve its single uint8 band,
  and honour the sentinel NoData value during masking logic.

expected_capabilities:
  - load
  - nodata-check
  - mask-read

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.649415
  east: 15.001893
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: water_mask_small.tif
  notes: notes.md

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 255
  nodata_convention: sentinel
  expected_band_count: 1
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [water]
  expected_compression: deflate
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 0.2509803922
  expected_mean_naive: 1.24609375
  nodata_pixel_count: 1
  expected_bounds: [500000.0, 4499840.0, 500160.0, 4500000.0]
params:
  generator: scripts/generate_raster_fixtures.py
  water_value: 1
  land_value: 0
