id: water_mask_small
title: Water Mask Small
description: >
  A tiny single-band uint8 binary water mask (0 = land, 1 = water) with a
  sentinel NoData value of 255. Exercises mask-style raster handling and
  nodata-aware logic.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - mask
  - water
  - product:mask
  - geography:utm
  - delivery:single-file

risk_types:
  - nodata_ignored
  - dtype_drift
  - mask_misread

behavioral_goal: >
  Confirm GeoCase can open a binary water mask, preserve its single uint8 band,
  and honour the sentinel NoData value during masking logic.

expected_capabilities:
  - load
  - nodata-check
  - mask-read

loader_hint: rasterio
crs: EPSG:32633

files:
  primary: water_mask_small.tif
  notes: notes.md

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 255
  nodata_convention: sentinel
  expected_band_count: 1
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [water]
  expected_compression: deflate

params:
  generator: scripts/generate_raster_fixtures.py
  water_value: 1
  land_value: 0
