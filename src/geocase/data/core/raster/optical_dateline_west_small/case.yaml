id: optical_dateline_west_small
title: Optical Dateline West Small
description: >-
  An RGB GeoTIFF whose bounds straddle the antimeridian at -180 longitude, mirroring
  optical_dateline_small about 180. The control for the crossing's sign: identical size,
  dtype, band count, CRS and pixel size, so a behavioural difference between the pair is
  attributable to the direction of the crossing and to nothing else.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - eo
  - optical
  - product:optical
  - geography:dateline
  - delivery:single-file
  - single_variable

risk_types:
  - extent/antimeridian
  - extent/bounds_normalization
  - extent/coordinate_wrapping
  - failure_mode/reference_implementation

behavioral_goal: >
  Answer whether antimeridian mishandling is symmetric. Round 6 found GDAL's
  AutoCreateWarpedVRT returning a zero-height dataset for the eastward-crossing
  sibling and could not say whether the westward crossing behaves the same,
  because no negative-wrap raster existed. Run both; a difference names the
  sign.

expected_capabilities:
  - load
  - crs-check

loader_hint: rasterio
crs: EPSG:4326

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 179.78
  south: 0.68
  east: -179.9
  north: 1.0

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Antimeridian, North Pacific"

files:
  primary: optical_dateline_west_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 4326
  expected_band_count: 3
  expected_dtype: uint8
  expected_shape: [16, 16]
  expected_band_names: [red, green, blue]
  expected_compression: deflate
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  nodata_pixel_count: 0
  expected_bounds: [-180.22, 0.68, -179.9, 1.0]
params:
  generator: scripts/generate_raster_fixtures.py
  control_for: optical_dateline_small
