id: rotated_two_islands_warped
title: Rotated Two Islands With Warped Reference
description: >
  The rotated two-islands raster shipped beside its own WarpedVRT, materialized
  as a north-up GeoTIFF sidecar. A rotated affine has no correct north-up
  reading, so a consumer compared only against itself can agree with itself and
  still be geographically wrong -- which is exactly how rio-tiler's read(),
  part() and preview() returned 9, 4 and 9 valid pixels against a reference of
  7, with no error and no warning. The pair states the right answer instead of
  leaving every consumer to rebuild it.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - transform
  - rotated
  - georeferencing
  - multi_layer

risk_types:
  - affine_transform_bug

behavioral_goal: >
  Confirm that a consumer reading the rotated primary agrees with the warped
  reference sidecar. The defect exists only in the relationship between the
  two files: each is internally consistent and reads cleanly on its own, and
  the disagreement is what the finding is made of.

expected_capabilities:
  - load
  - affine-transform-check
  - bounds-check
  - transform-inspection

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.520215
  south: 0.016235
  east: 10.522007
  north: 0.018039

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Equator, Gulf of Guinea (synthetic)"

files:
  primary: rotated_two_islands_warped.tif
  notes: notes.md
  sidecars:
    - rotated_two_islands_warped_reference.tif

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expected_shape: [8, 8]
  expected_dtype: float32
  expected_band_count: 1
  expect_nodata: true
  expected_nodata_value: -9999.0
  nodata_convention: sentinel
  expected_transform_signs:
    - negative_e
    - rotated
