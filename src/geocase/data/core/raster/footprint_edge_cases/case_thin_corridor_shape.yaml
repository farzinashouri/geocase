id: thin_corridor_shape
title: Thin Corridor Shape Raster
description: >
  Raster whose valid region forms a thin corridor geometry, sensitive
  to simplification and footprint stability assumptions.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - footprint
  - edge
  - corridor

risk_types:
  - footprint/generation_error
  - geometry/simplification_loss

behavioral_goal: >
  Verify footprint generation preserves narrow valid structures and
  remains close to expected geometry.

expected_capabilities:
  - load
  - footprint-generation

loader_hint: rasterio

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 17.583918
  south: 46.021104
  east: 17.588583
  north: 46.024353

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Central Europe (synthetic, UTM 33N)"

files:
  primary: thin_corridor_shape.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_shape: [14, 14]
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 100.0
  expected_mean_naive: -8865.4387755102
  nodata_pixel_count: 174
  expected_bounds: [700000.0, 5099650.0, 700350.0, 5100000.0]
params:
  expected_footprint: thin_corridor_shape_footprint_truth.geojson
  # A recording of ``gdal_footprint``'s own hull output, not truth.
  recorded_gdal_footprint: thin_corridor_shape_footprint_gdal_hull.geojson
  # Measured on the mask-exact truth footprint: 0.275.
  min_rect_ratio: 0.25
