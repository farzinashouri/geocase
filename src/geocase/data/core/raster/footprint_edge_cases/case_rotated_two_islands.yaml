id: rotated_two_islands
title: Rotated Two Islands Raster
description: >
  Raster with rotated/skewed transform and disconnected valid regions,
  designed to stress convex-hull style footprint generation.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - footprint
  - edge
  - rotated

risk_types:
  - affine_transform_bug
  - footprint_generation_error

behavioral_goal: >
  Validate footprint extraction under rotated transform and disconnected
  valid pixel islands.

expected_capabilities:
  - load
  - affine-transform-check
  - footprint-generation

loader_hint: rasterio

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 10.520215
  south: 0.016235
  east: 10.522007
  north: 0.018039

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Equator, Gulf of Guinea (synthetic)"

files:
  primary: rotated_two_islands.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_shape: [8, 8]
  # Backfilled in plan 34: this case always had a rotated affine (non-zero
  # b/d as well as a negative e). Declaring it turns a property the corpus
  # merely had into one it states and the content gate checks.
  expected_transform_signs:
    - negative_e
    - rotated

params:
  expected_footprint: rotated_two_islands_footprint_truth.geojson
  # A recording of ``gdal_footprint``'s own hull output, not truth.
  recorded_gdal_footprint: rotated_two_islands_footprint_gdal_hull.geojson
  # Measured on the mask-exact truth footprint: 0.375.
  min_rect_ratio: 0.35
