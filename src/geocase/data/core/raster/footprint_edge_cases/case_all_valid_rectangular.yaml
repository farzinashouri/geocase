id: all_valid_rectangular
title: All Valid Rectangular Raster
description: >
  Raster with fully valid rectangular coverage used as a baseline
  footprint edge-case fixture.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - footprint
  - edge
  - rectangular

risk_types:
  - footprint/generation_error

behavioral_goal: >
  Confirm footprint generation returns a clean geometry for a fully
  valid rectangular raster.

expected_capabilities:
  - load
  - bounds-check
  - footprint-generation

loader_hint: rasterio

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 37.944345
  east: 15.004097
  north: 37.94759

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: all_valid_rectangular.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_shape: [12, 12]
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 100.0
  expected_mean_naive: 100.0
  nodata_pixel_count: 0
  expected_bounds: [500000.0, 4199640.0, 500360.0, 4200000.0]
params:
  expected_footprint: all_valid_rectangular_footprint_truth.geojson
  # Measured on the mask-exact truth footprint: 1.0.
  min_rect_ratio: 0.99
