id: nonsquare_diagonal_sparse
title: Nonsquare Diagonal Sparse Raster
description: >
  Raster with non-square cells and sparse diagonal valid pixels to
  surface edge behavior in footprint generation.
category: raster
format: GeoTIFF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - footprint
  - edge
  - sparse

risk_types:
  - pixel_shape_assumption
  - footprint_generation_error

behavioral_goal: >
  Ensure footprint extraction remains robust for sparse and anisotropic
  raster sampling patterns.

expected_capabilities:
  - load
  - bounds-check
  - footprint-generation

loader_hint: rasterio

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 12.004239
  south: 41.510469
  east: 12.010082
  north: 41.512777

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: nonsquare_diagonal_sparse.tif
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_shape: [8, 8]

params:
  expected_footprint: nonsquare_diagonal_sparse_footprint_truth.geojson
  # A recording of ``gdal_footprint``'s own hull output, not truth.
  recorded_gdal_footprint: nonsquare_diagonal_sparse_footprint_gdal_hull.geojson
  # Measured on the mask-exact truth footprint: 0.5.
  min_rect_ratio: 0.45
