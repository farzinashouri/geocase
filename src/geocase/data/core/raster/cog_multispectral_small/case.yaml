id: cog_multispectral_small
title: COG Multispectral Small
description: >
  A tiny four-band uint16 Cloud-Optimized GeoTIFF (blue, green, red, NIR):
  internally tiled with one overview level and a sentinel NoData of 0.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - cog
  - multispectral
  - product:cog
  - geography:utm
  - delivery:cloud-optimized

risk_types:
  - overviews_missing
  - not_tiled
  - band_loss
  - nodata_ignored

behavioral_goal: >
  Confirm GeoCase recognises a tiled, overview-bearing multispectral GeoTIFF as
  COG-structured while preserving band order and NoData.

expected_capabilities:
  - load
  - multiband-read
  - cog-check
  - overview-check

loader_hint: rasterio
crs: EPSG:32633

files:
  primary: cog_multispectral_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 0
  nodata_convention: sentinel
  expected_band_count: 4
  expected_dtype: uint16
  expected_shape: [64, 64]
  expected_band_names: [blue, green, red, nir]
  expected_compression: deflate
  expected_overviews: true
  is_cog: true

params:
  generator: scripts/generate_raster_fixtures.py
