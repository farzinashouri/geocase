id: cog_multispectral_small
title: COG Multispectral Small
description: >-
  A four-band Cloud-Optimized GeoTIFF (blue, green, red, NIR) with NoData, internal tiling and
  one overview level. Exercises COG structure validation.
category: raster
format: GeoTIFF
test_tier: integration
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - raster
  - geotiff
  - cog
  - multispectral
  - product:cog
  - geography:utm
  - delivery:cloud-optimized

risk_types:
  - band/loss
  - format/not_tiled
  - format/overviews_missing
  - nodata/ignored

behavioral_goal: >
  Confirm GeoCase recognises a tiled, overview-bearing multispectral GeoTIFF as
  COG-structured while preserving band order and NoData.

expected_capabilities:
  - load
  - multiband-read
  - cog-check
  - overview-check

loader_hint: rasterio
crs: EPSG:32633

# Generated by scripts/catalog_extent.py -- do not edit by hand.
# west > east means the box crosses the antimeridian.
extent:
  west: 15.0
  south: 40.645091
  east: 15.00757
  north: 40.650857

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Southern Italy / Sicily (synthetic, UTM 33N)"

files:
  primary: cog_multispectral_small.tif

source:
  name: geocase-synthetic
  license: MIT

assertions:
  expect_loadable: true
  expect_crs: true
  expected_epsg: 32633
  expect_nodata: true
  expected_nodata_value: 0
  nodata_convention: sentinel
  expected_band_count: 4
  expected_dtype: uint16
  expected_shape: [64, 64]
  expected_band_names: [blue, green, red, nir]
  expected_compression: deflate
  expected_overviews: true
  is_cog: true
  # Generated by scripts/catalog_truth.py -- do not edit by hand.
  # expected_bounds is in the case CRS, not 4326 (see extent:).
  expected_mean_masked: 2640.0
  expected_mean_naive: 2477.578125
  nodata_pixel_count: 1008
  expected_bounds: [500000.0, 4499360.0, 500640.0, 4500000.0]
params:
  generator: scripts/generate_raster_fixtures.py
