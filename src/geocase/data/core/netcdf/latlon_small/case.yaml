id: latlon_small
title: Lat/Lon Small NetCDF
description: >
  A minimal CF-compliant NetCDF file with latitude/longitude
  dimensions and a single data variable.  Baseline for xarray-based
  loading and coordinate inspection.
category: netcdf
format: NetCDF
test_tier: unit
size_class: tiny
storage_class: bundled
redistributable: true
schema_version: "1.0"
status: validated

tags:
  - netcdf
  - cf-conventions
  - latlon
  - nodata
  - masking

# `coordinate_order` and `dimension_mismatch` were removed in plan 34: this is
# conventional (latitude, longitude) rectilinear data, so neither risk is
# exercised by the file. A case that returns green for a property it cannot
# test terminates the user's search. `cf_time_ordering_netcdf` carries the
# dimension-ordering risk against bytes that actually demonstrate it.
risk_types:
  - nodata_ignored

behavioral_goal: >
  Verify that latitude/longitude dimensions are correctly identified,
  fill values are masked, and basic slicing works.

expected_capabilities:
  - load
  - coordinate-inspection
  - nodata-check

loader_hint: xarray
crs: EPSG:4326

# Hand-written; scripts/catalog_extent.py does not touch it.
region: "Global grid (synthetic)"

files:
  primary: latlon_sample.nc
  notes: notes.md

source:
  name: geocase-curated
  license: MIT

# `expect_crs`/`expected_epsg` were removed in plan 34 for the same reason as
# the two risk types above: the file carries no `grid_mapping` attribute and no
# `crs` variable, so a CRS claim here is undemonstrable. The `crs:` key above
# still records the coordinates' reference system as documentation.
assertions:
  expect_loadable: true
  expect_nodata: true

# Renamed from `dimensions`/`variables` in plan 34. The old names were read by
# nothing; these are checked against the real file by `check_netcdf_content`,
# and `expected_dimensions` is compared in order so a dimension-ordering claim
# is checkable at all.
params:
  expected_dimensions:
    - latitude
    - longitude
  expected_variables:
    - temperature
  fill_value: -9999.0
