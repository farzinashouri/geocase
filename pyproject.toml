[build-system]
# Floored, not just named: the backend decides the wheel's Metadata-Version,
# and twine refuses metadata newer than it knows. An unpinned backend let CI
# resolve a hatchling that emitted 2.5 while the pinned twine 6.1.0 rejected
# it -- a release-blocking failure with no code change behind it. Moving this
# floor means checking the twine pin in .github/workflows/release.yml.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geocase"
version = "1.0.0rc3"
description = "A curated library of geospatial test cases for automated and parameterized testing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Farzin Ashouri" },
]
keywords = [
    "geospatial",
    "testing",
    "gis",
    "pytest",
    "test-cases",
    "fixtures",
    "raster",
    "vector",
    "geotiff",
    "crs",
    "nodata",
    "antimeridian",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # The spec table has exactly one home and this package is its first
    # consumer. The dependency is deliberately one-directional: geofacts
    # has zero dependencies, permanently, and must never import from geocase
    # (Plan 20 trap 6) — that property is its entire adoption argument.
    "geofacts>=0.1.2",
]

[project.optional-dependencies]
# Every entry is bounded at the next major. These extras are the convenience
# loaders (case.load(), case.read()) -- NOT how a case is read. primary_path is
# an ordinary filesystem path, so a user with a working geo stack installs
# plain `geocase` and reads cases with the readers they already have; the core
# needs only pydantic, pyyaml and geofacts.
#
# `[all]` is for GREENFIELD environments. It re-resolves numpy and pandas, and
# installing it over an existing stack has broken one: a venv with
# --system-site-packages over GDAL 3.6.2 / geopandas 0.12.2 got numpy 2.4.6
# against scipy 1.10.1, a shadowed system geopandas, and pandas left
# unimportable. See the install-shapes section of README.md.
vector = ["geopandas>=0.14,<2", "shapely>=2.0,<3", "pyarrow>=14.0,<23"]
raster = ["rasterio>=1.3,<2"]
# Writing fixture files. The raster primitive itself needs no writer: its
# .array/.transform/.crs_wkt are public so a caller who already uses osgeo.gdal
# can build the file however they like.
write = ["rasterio>=1.3,<2"]
netcdf = ["xarray>=2023.1,<2027", "netCDF4>=1.6,<2"]
all = ["geocase[vector,raster,netcdf]"]
# The benchmark runner (Plan 15). scikit-learn is here because committed
# generated modules may import it during re-grading.
bench = ["geocase[vector,raster]", "httpx>=0.27,<1", "scikit-learn>=1.4,<2"]
dev = [
    "geocase[all]",
    "geocase[bench]",
    "pytest>=7.0,<9",
    "pytest-cov>=4.0,<8",
    "mypy>=1.0,<2",
    "types-PyYAML<7",
    "types-shapely<3",
    # Pinned to one minor: the CI lint gate runs `ruff format --check`, and
    # formatter output can change between minors.
    "ruff>=0.15.7,<0.16",
]
docs = [
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.0,<10",
]

[project.entry-points.pytest11]
geocase = "geocase.pytest_plugin"

[project.urls]
Homepage = "https://github.com/farzinashouri/geocase"
Documentation = "https://farzinashouri.github.io/geocase"
Repository = "https://github.com/farzinashouri/geocase"
Issues = "https://github.com/farzinashouri/geocase/issues"
Changelog = "https://github.com/farzinashouri/geocase/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/geocase"]

# conda-forge builds from the sdist, so it must carry `tests/` (the recipe's test
# section runs the suite against the installed package) alongside the sources.
[tool.hatch.build.targets.sdist]
include = [
    "src/geocase",
    "tests",
    "conftest.py",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    # `remote` is also registered by the plugin itself (see
    # pytest_plugin/markers.py) so it works in a fresh install; it is repeated
    # here because this repository's own suite runs with the plugin under test.
    # `slow` was declared here and used zero times — dropped in Step 13.5.
    "remote: a GeoCase case whose data is not bundled with the package",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
# `strict = true` used to be set repo-wide, but every error it produced was a
# missing stub, so it never actually checked a function body. The strict flags
# now apply per-module (below) to the packages that are part of the v1.0
# compatibility promise; the rest ratchets in v1.1.

# Geospatial dependencies ship no type information. `follow_imports` is left
# alone deliberately: this silences the "no stubs" error without silencing
# anything about our own code.
[[tool.mypy.overrides]]
module = [
    "geopandas.*",
    "netCDF4.*",
    "osgeo.*",
    "pyarrow.*",
    "pyproj.*",
    "rasterio.*",
    "xarray.*",
]
ignore_missing_imports = true

# The gated surface: the catalog layer, and `geocase.api.*` once Step 15
# creates it. Listing `api` before it exists is harmless — mypy ignores
# overrides for modules it never sees — and means the gate is already in place
# when the module lands.
[[tool.mypy.overrides]]
module = ["geocase.catalog.*", "geocase.api.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 88
# Verbatim model-generated benchmark artifacts: they must stay byte-identical
# to what the agents wrote (their hashes are provenance), so neither the
# formatter nor the linter may touch them. Reformatting a committed module
# would invalidate the module_sha256 recorded alongside it and silently break
# the reproducibility pin.
extend-exclude = [
    "tests/benchmark/agent_baseline/generated",
    "results/runs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# The bare-track prompt template is sent to models verbatim; reflowing its
# lines to satisfy the line-length gate would change the prompt itself.
"src/geocase/benchmark/runner/bare.py" = ["E501"]
