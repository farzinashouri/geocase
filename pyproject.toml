[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geocase"
version = "0.1.0"
description = "A curated library of geospatial test cases for automated and parameterized testing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Farzin Ashouri" },
]
keywords = ["geospatial", "testing", "gis", "pytest", "test-cases"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vector = ["geopandas>=0.14", "shapely>=2.0", "pyarrow>=14.0"]
raster = ["rasterio>=1.3"]
netcdf = ["xarray>=2023.1", "netCDF4>=1.6"]
all = ["geocase[vector,raster,netcdf]"]
dev = [
    "geocase[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.entry-points.pytest11]
geocase = "geocase.pytest_plugin"

[project.urls]
Homepage = "https://github.com/farzinashouri/geocase"
Documentation = "https://farzinashouri.github.io/geocase"
Repository = "https://github.com/farzinashouri/geocase"

[tool.hatch.build.targets.wheel]
packages = ["src/geocase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "remote: marks tests that require network access",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
