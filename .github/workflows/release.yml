# Build and publish, triggered by a version tag or run by hand.
#
# Uploading uses PyPI's OIDC trusted publishing: GitHub mints a short-lived
# JWT, PyPI exchanges it for an API token good for ~15 minutes. No API token is
# ever stored as a repository secret, so there is nothing to leak or rotate.
# That is what `permissions: id-token: write` grants -- it is scoped per job,
# and only the two publish jobs get it.

name: Release

on:
  push:
    tags:
      # rc tags (v1.0.0rc1) and final tags (v1.0.0) both build; which registry
      # they upload to is chosen by the environment picked when the run is
      # approved.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  # Manual runs build from whatever ref is selected, so there is no tag to
  # check the artifact version against -- see the `Verify artifacts` step.
  # Prefer the tag path for anything reaching real PyPI: the tag is what
  # records which commit an immutable release was built from.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          # Pinned, like the lint gate: an unpinned build backend would let
          # the artifact change without a code change.
          #
          # twine must be new enough for the Metadata-Version the build
          # backend emits. Current hatchling writes 2.5, which twine 6.1.0
          # rejects outright as invalid metadata -- a green local `twine
          # check` on a newer twine is not evidence this passes here. Bump
          # this pin whenever the hatchling floor in pyproject.toml moves.
          python -m pip install "build==1.2.2" "twine==7.0.0"
          # The verifier imports `geocase.catalog.loader` to read the case
          # index, and compares the artifact version against
          # `geocase.__version__`. That import chain reaches `yaml` and
          # `pydantic`, so the runtime dependencies must be installed too --
          # `--no-deps` here fails on a clean runner with ModuleNotFoundError.
          python -m pip install -e .

      - name: Build sdist and wheel
        run: python -m build

      # The gate. PyPI artifacts are immutable, so a wheel missing
      # `geocase/data/**` would be a permanently broken release. This checks
      # every case indexed in `case-index.yaml` is present, that the version
      # matches the tag,
      # and that no `__pycache__`/`.pyc`/`.DS_Store` slipped in.
      #
      # `--expected-version` is only passed on a tag push. On a manual run
      # GITHUB_REF_NAME is the branch (`main`), which is not a version and
      # would fail the check. Passing a hand-typed version instead would be
      # worse than passing none: the verifier always cross-checks the wheel
      # and sdist against `pyproject.toml`, so that check still runs -- what
      # a manual run gives up is only the tag/artifact agreement, which is
      # exactly the thing a manual run has no tag to assert.
      - name: Verify artifacts
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/verify_dist.py dist/ --expected-version "${GITHUB_REF_NAME}"
          else
            python scripts/verify_dist.py dist/
          fi

      - name: Twine check
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Both publish jobs are gated on a GitHub Environment, which is what makes
  # them manual: the run pauses for approval before uploading. Cutting a tag
  # and uploading should not be the same action, because the upload cannot be
  # undone.

  publish-testpypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
