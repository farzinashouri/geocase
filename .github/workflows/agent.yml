# Scheduled development agent (Plan 49). Triages issues, rewrites the pinned
# "Development queue" issue, implements the top `agent:ready` issue as a PR,
# and stops with `agent:needs-human` when a person is required.
# It never merges, tags, releases or pushes to main -- the prompt file says so
# and the --disallowedTools list below enforces it. Structure is pinned by
# tests/unit/test_agent_workflow.py.
name: Agent

on:
  # Enabled by #43 after the triage-only dry run (#42) was reviewed.
  # One issue per run: the prompt implements only the top agent:ready issue.
  schedule:
    - cron: "17 1 * * *"   # every night, 01:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "full = implement one issue; triage = labels + queue only"
        default: triage
        type: choice
        options: [triage, full]

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Prefer a fine-grained PAT: PRs opened with GITHUB_TOKEN do not trigger
      # ci.yml, so the agent's PRs arrive untested until someone pushes to
      # them. Without the secret the run still works on GITHUB_TOKEN.
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || github.token }}
      # Bare-track benchmark runs (non-Claude models only). The key carries a
      # credit limit set on OpenRouter, which caps what the agent can spend.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          fetch-depth: 0
      # The conda `geocase` env is the only one with GDAL/osgeo, which the
      # catalog gates and examples/ need (see CLAUDE.md "Environments").
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: geocase
          miniforge-version: latest
      # Claude's Bash tool does not run a login shell, so put the env on PATH.
      - name: Install geocase into the conda env
        shell: bash -el {0}
        run: |
          python -m pip install -e ".[dev]" "ruff==0.15.7" mypy
          echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"
      # The agent's sandbox refuses network calls and reading the environment
      # (#67), so this fixed step checks the key and saves the model list. The
      # model never gets curl next to the secret. The key itself is not written.
      - name: OpenRouter preflight
        run: |
          mkdir -p /tmp/openrouter
          if [ -n "$OPENROUTER_API_KEY" ]; then key=set; else key=missing; fi
          echo "OPENROUTER_API_KEY: $key" > /tmp/openrouter/status.txt
          if curl -sf --max-time 30 https://openrouter.ai/api/v1/models \
              -o /tmp/openrouter/models.json; then
            echo "models.json: fetched $(date -u +%FT%TZ)" >> /tmp/openrouter/status.txt
          else
            echo "models.json: fetch failed" >> /tmp/openrouter/status.txt
          fi
          cat /tmp/openrouter/status.txt
      - uses: anthropics/claude-code-action@v1
        id: claude
        # So the report step below always runs; the last step re-fails the job.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          prompt: |
            Mode: ${{ github.event.inputs.mode || 'full' }}. In triage mode do steps 1-2 only.
            Follow .claude/commands/work-next-issue.md exactly.
            For OpenRouter work, read /tmp/openrouter/status.txt (key set or missing)
            and /tmp/openrouter/models.json (current model list, with pricing) instead
            of calling the API or reading the environment.
          claude_args: >-
            --max-turns 250
            --add-dir /tmp
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep"
            "Bash(gh:*)" "Bash(git:*)" "Bash(python:*)" "Bash(pytest:*)"
            "Bash(ruff:*)" "Bash(mypy:*)" "Bash(mkdocs:*)"
            "Bash(python3:*)" "Bash(ls:*)" "Bash(grep:*)" "Bash(head:*)" "Bash(sed:*)"
            "Bash(cat:*)" "Bash(tail:*)" "Bash(cd:*)" "Bash(for:*)" "Bash(echo:*)"
            --disallowedTools "Bash(gh pr merge:*)" "Bash(git tag:*)" "Bash(gh release:*)"
            "Bash(git push origin main:*)" "Bash(git push -f:*)" "Bash(git push --force:*)"
            "Bash(git revert:*)" "Bash(rm -rf:*)" "Bash(gh workflow run:*)"
      # The log holds no transcript; keep it so a run that ends without doing
      # its work (#70, #67) can be diagnosed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14
          if-no-files-found: warn
      # One comment per run on the pinned "Agent run reports" issue; subscribing
      # to it gives an email per run (Plan 52). Created if missing. Posts as
      # github-actions[bot]: GitHub never emails the owner about comments made
      # with the owner's own PAT.
      - name: Agent run report
        if: always()
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ github.event.inputs.mode || 'full' }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          gh pr list --state open --json number,headRefName,statusCheckRollup \
            > /tmp/agent-prs.json || echo '[]' > /tmp/agent-prs.json
          python3 scripts/agent_run_report.py --execution-file "${EXEC_FILE:-/nonexistent}" \
            --outcome "$OUTCOME" --run-url "$RUN_URL" --mode "$MODE" \
            --max-turns 250 --prs-file /tmp/agent-prs.json > /tmp/agent-report.md
          cat /tmp/agent-report.md >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --state open --search '"Agent run reports" in:title' \
            --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            issue=$(gh issue create --title "Agent run reports" \
              --body "One comment per nightly agent run. Subscribe for email." \
              | grep -o '[0-9]*$')
          fi
          gh issue comment "$issue" --body-file /tmp/agent-report.md \
            || echo "::warning::could not comment on #$issue"
      # The model may not merge (deny list above). This fixed step turns on
      # GitHub auto-merge for open agent/* PRs: each merges once the checks
      # required by the main_protected ruleset pass, and never bypasses them.
      - name: Enable auto-merge on agent PRs
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("agent/")) | .number' |
          while read -r pr; do
            gh pr merge "$pr" --auto --merge || echo "::warning::auto-merge not enabled on #$pr"
          done
      # continue-on-error above would otherwise leave a failed run green.
      - name: Fail if the agent step failed
        if: steps.claude.outcome == 'failure'
        run: |
          echo "::error::the agent step failed; see the run report"
          exit 1
