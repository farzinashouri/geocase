# Scheduled development agent (Plan 49). Triages issues, rewrites the pinned
# "Development queue" issue, implements the top `agent:ready` issue as a PR,
# and stops with `agent:needs-human` when a person is required.
# It never merges, tags, releases or pushes to main -- see the prompt file.
name: Agent

on:
  schedule:
    - cron: "17 1 * * 1-5"   # weekday nights, 01:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "full = implement one issue; triage = labels + queue only"
        default: triage
        type: choice
        options: [triage, full]

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A fine-grained PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do
      # not trigger ci.yml, so the agent's PRs would arrive untested.
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] "ruff==0.15.7" mypy
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          prompt: |
            Mode: ${{ github.event.inputs.mode || 'full' }}. In triage mode do steps 1-2 only.
            Follow .claude/commands/work-next-issue.md exactly.
          claude_args: "--max-turns 120"
