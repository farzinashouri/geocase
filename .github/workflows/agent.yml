# Scheduled development agent (Plan 49). Triages issues, rewrites the pinned
# "Development queue" issue, implements the top `agent:ready` issue as a PR,
# and stops with `agent:needs-human` when a person is required.
# It never merges, tags, releases or pushes to main -- the prompt file says so
# and the --disallowedTools list below enforces it. Structure is pinned by
# tests/unit/test_agent_workflow.py.
name: Agent

on:
  # Enabled by #43 after the triage-only dry run (#42) was reviewed.
  # One issue per run: the prompt implements only the top agent:ready issue.
  schedule:
    - cron: "17 1 * * 1-5"   # weekday nights, 01:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "full = implement one issue; triage = labels + queue only"
        default: triage
        type: choice
        options: [triage, full]

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Prefer a fine-grained PAT: PRs opened with GITHUB_TOKEN do not trigger
      # ci.yml, so the agent's PRs arrive untested until someone pushes to
      # them. Without the secret the run still works on GITHUB_TOKEN.
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          fetch-depth: 0
      # The conda `geocase` env is the only one with GDAL/osgeo, which the
      # catalog gates and examples/ need (see CLAUDE.md "Environments").
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: geocase
          miniforge-version: latest
      # Claude's Bash tool does not run a login shell, so put the env on PATH.
      - name: Install geocase into the conda env
        shell: bash -el {0}
        run: |
          python -m pip install -e ".[dev]" "ruff==0.15.7" mypy
          echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          prompt: |
            Mode: ${{ github.event.inputs.mode || 'full' }}. In triage mode do steps 1-2 only.
            Follow .claude/commands/work-next-issue.md exactly.
          claude_args: >-
            --max-turns 120
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep"
            "Bash(gh:*)" "Bash(git:*)" "Bash(python:*)" "Bash(pytest:*)"
            "Bash(ruff:*)" "Bash(mypy:*)" "Bash(mkdocs:*)"
            --disallowedTools "Bash(gh pr merge:*)" "Bash(git tag:*)" "Bash(gh release:*)"
            "Bash(git push origin main:*)" "Bash(git push -f:*)" "Bash(git push --force:*)"
            "Bash(git revert:*)" "Bash(rm -rf:*)" "Bash(gh workflow run:*)"
      # The model may not merge (deny list above). This fixed step turns on
      # GitHub auto-merge for open agent/* PRs: each merges once the checks
      # required by the main_protected ruleset pass, and never bypasses them.
      - name: Enable auto-merge on agent PRs
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("agent/")) | .number' |
          while read -r pr; do
            gh pr merge "$pr" --auto --merge || echo "::warning::auto-merge not enabled on #$pr"
          done
