# Plan 48 Phase 4 — Sonnet 5 at every effort level, three trials each
# (23 geo tasks x 5 arms x 3 trials = 345 invocations, ~1 h at 6 rpm plus
# thinking time; fits the 400/day quota only on a day with nothing else run).
#
# Why: with Haiku (2026-09-13) and Opus (2026-09-14) measured at all five
# levels, Sonnet fills the middle of the model axis, so the report can say
# whether the effort curve and the per-category profile change with model
# size or only with the thinking budget.
#
# Same pacing and comparability caveats as models-claude-effort-pilot-k3.yaml;
# `ANTHROPIC_API_KEY` must be unset. Resume is the default: rerunning the same
# command picks up where an interrupted run stopped, arm by arm.

defaults:
  trials: 3
  temperature: null
  exec_timeout_s: 60

budget:
  max_usd_total: 0.0

limits:
  rpm: 6
  requests_per_day: 400
  quota_file: .geocase_quota_claude.json

models:
  - id: claude-sonnet-5
    label: Sonnet 5 (Claude Code CLI)
    tracks: [effort]
    provider: claude-cli
    # max dropped 2026-09-15: four arms (276 calls) fit the remaining daily quota;
    # add it back and rerun the same command to fill the fifth arm.
    effort: [low, medium, high, xhigh]
