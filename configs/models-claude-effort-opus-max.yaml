# Plan 48 Phase 4 step 2 — one Opus 5 arm at `--effort max`, three trials
# (23 geo tasks x 1 arm x 3 trials = 69 invocations).
#
# Why this arm alone: the Haiku pilot (read 2026-09-14) put the best arm at
# C = 65 %, but Haiku is not a frontier model, so its `max` is a lower bound on
# the ceiling and Plan 46 §1.3's band stays provisional until a frontier model
# has been measured at `max`. U27 was negative on Haiku, so no other effort
# level of Opus is run here: the question is the ceiling, not the axis.
#
# Same pacing and comparability caveats as models-claude-effort-pilot-k3.yaml;
# `ANTHROPIC_API_KEY` must be unset.

defaults:
  trials: 3
  temperature: null
  exec_timeout_s: 60

budget:
  max_usd_total: 0.0

limits:
  rpm: 6
  requests_per_day: 400
  quota_file: .geocase_quota_claude.json

models:
  - id: claude-opus-5
    label: Opus 5 (Claude Code CLI)
    tracks: [effort]
    provider: claude-cli
    effort: [max]
