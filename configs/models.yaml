# Model roster for the OpenRouter runner (Plan 15 Phase 4).
# Extend the list freely; every run is bounded by budget.max_usd_total,
# enforced against OpenRouter's returned usage.cost (hard abort).
#
# Ids verified against https://openrouter.ai/api/v1/models on 2026-08-09.
# The free tier churns: an id that vanishes returns 404 at call time, so
# re-check this list before a run rather than trusting it indefinitely.

defaults:
  trials: 3
  temperature: 0.2
  max_turns: 12        # agentic track only (not used by the one-off bare runner)
  exec_timeout_s: 60

budget:
  max_usd_total: 15.00
  # Per-model ceiling: without it one long-running reasoning model can eat the
  # whole budget before the cheap models are ever reached. A model that trips
  # it is skipped, not fatal to the run.
  max_usd_per_model: 4.00

# Account-wide pacing (Plan 17 Phase 1). Paid ids are not rate-limited the way
# `:free` ones are, so rpm is null here and set to 18 in models-free.yaml.
limits:
  rpm: null
  requests_per_day: null
  quota_file: .geocase_quota.json
retry:
  max_retry_after: 60
  honor_long_retry_after: false
  max_total_seconds: 180

# `pricing:` below is USD per 1M tokens (prompt/completion), used only to
# estimate spend before a run — `--dry-run` prints est_usd from it. The hard
# budget abort is always enforced against OpenRouter's returned usage.cost, so
# a stale price here can never cause an overspend, only a wrong estimate.

models:
  # Free tier
  - id: openai/gpt-oss-20b:free
    label: GPT-OSS 20B (free)
    tracks: [bare]
    supports_tools: false
    pricing: {prompt_usd_per_1m: 0, completion_usd_per_1m: 0}
  - id: cohere/north-mini-code:free
    label: North Mini Code (free)
    tracks: [bare]
    supports_tools: false
    pricing: {prompt_usd_per_1m: 0, completion_usd_per_1m: 0}
  - id: nvidia/nemotron-3-super-120b-a12b:free
    label: Nemotron 3 Super 120B (free)
    tracks: [bare]
    supports_tools: false
    pricing: {prompt_usd_per_1m: 0, completion_usd_per_1m: 0}
