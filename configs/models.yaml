# Model roster for the OpenRouter runner (Plan 15 Phase 4).
# Extend the list freely; every run is bounded by budget.max_usd_total,
# enforced against OpenRouter's returned usage.cost (hard abort).
#
# Ids verified against https://openrouter.ai/api/v1/models on 2026-08-09.
# The free tier churns: an id that vanishes returns 404 at call time, so
# re-check this list before a run rather than trusting it indefinitely.

defaults:
  trials: 3
  temperature: 0.2
  max_turns: 12        # agentic track only (not used by the one-off bare runner)
  exec_timeout_s: 60

budget:
  max_usd_total: 10.00

models:
  # Free tier
  - id: openai/gpt-oss-20b:free
    label: GPT-OSS 20B (free)
    tracks: [bare]
    supports_tools: false
  - id: cohere/north-mini-code:free
    label: North Mini Code (free)
    tracks: [bare]
    supports_tools: false
  - id: nvidia/nemotron-3-super-120b-a12b:free
    label: Nemotron 3 Super 120B (free)
    tracks: [bare]
    supports_tools: false
  # Paid
  - id: openai/gpt-5-mini
    label: GPT-5 mini
    tracks: [bare]
    supports_tools: true
  - id: google/gemini-2.5-flash
    label: Gemini 2.5 Flash
    tracks: [bare]
    supports_tools: true
  # Paid, added 2026-08-10. Prices are USD per 1M tokens (in/out) as
  # reported by /api/v1/models on that date; ordered cheapest first.
  - id: qwen/qwen3.7-flash            # $0.03 / $0.13
    label: Qwen3.7 Flash
    tracks: [bare]
    supports_tools: true
  - id: qwen/qwen3-coder-next         # $0.12 / $0.80
    label: Qwen3 Coder Next
    tracks: [bare]
    supports_tools: true
  - id: deepseek/deepseek-v4-flash    # $0.14 / $0.28
    label: DeepSeek V4 Flash
    tracks: [bare]
    supports_tools: true
  - id: minimax/minimax-m3            # $0.30 / $1.20
    label: MiniMax M3
    tracks: [bare]
    supports_tools: true
  - id: z-ai/glm-5.2                  # $0.76 / $2.42
    label: GLM-5.2
    tracks: [bare]
    supports_tools: true
  - id: google/gemini-3.6-flash       # $1.50 / $7.50
    label: Gemini 3.6 Flash
    tracks: [bare]
    supports_tools: true
  - id: moonshotai/kimi-k3            # $3.00 / $15.00
    label: Kimi K3
    tracks: [bare]
    supports_tools: true
  - id: anthropic/claude-haiku-4.5    # $1.00 / $5.00
    label: Claude Haiku 4.5
    tracks: [bare]
    supports_tools: true
  - id: anthropic/claude-sonnet-5     # $2.00 / $10.00 (intro rate)
    label: Claude Sonnet 5
    tracks: [bare]
    supports_tools: true
  - id: anthropic/claude-opus-5       # $5.00 / $25.00 — most expensive
    label: Claude Opus 5
    tracks: [bare]
    supports_tools: true
