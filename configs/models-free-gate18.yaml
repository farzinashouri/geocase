# Plan 18 Phase 0 gate roster: four distinct free families, one model each.
# openai/gpt-oss-20b is omitted — already run (2 trials, both SILENT).
# Derived from models-free.yaml; kept separate so that file stays canonical.
defaults:
  trials: 1
  temperature: 0.2
  exec_timeout_s: 60
budget:
